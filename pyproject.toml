[project]
name = "vibesim"
version = "0.1.0"
description = "VibeSim — discrete-event simulator for ML serving + training workloads"
requires-python = ">=3.12,<3.13"
dependencies = [
    "transformers>=5.13.0",
]

[tool.uv]
package = false
# This repo's normal Python working env includes tests/lint plus L1 profiling
# deps, so plain `uv run ...` matches the environment used by subprocess
# profilers. Use `--no-default-groups` only for intentionally minimal checks.
default-groups = ["dev", "profiling", "launcher", "analyze"]
# DeepGEMM's setup.py imports torch at build time but doesn't declare it as a
# build dep, so it can't build under PEP-517 isolation. Build it against the
# already-synced env torch instead. (Reproducible: the commit is pinned below.)
no-build-isolation-package = ["deep-gemm"]

[dependency-groups]
dev = [
    "duckdb>=1.5.3",
    "pyarrow>=24.0.0",
    "pytest>=9.0.0",
    "pytest-xdist>=3.6",
    "ruff>=0.14.0",
]
# Analyzer plot renderer (analyzer/python). Reads Rust-emitted payload JSON and
# draws PNGs — matplotlib only, no parquet/pandas (the Rust side owns parquet).
analyze = [
    "matplotlib>=3.9",
]
# L7-α launcher runtime deps. `asteval` evaluates `derived` / `constraints`
# preset expressions in a sandboxed AST (no raw `eval`); see launcher/schema.
# `pyyaml` reads YAML presets (the default preset format; JSON is the subset the
# binary is handed). Mirrors the Rust side's `serde_yaml`.
launcher = [
    "asteval>=1.0.0",
    "pyyaml>=6.0",
]
profiling = [
    "numpy>=2.0.0",
    "nvidia-ml-py>=12.0.0",
    # Keep the first L1 profiling env close to the known-good reference stack.
    # Broaden these only after validating the cluster driver/runtime pair.
    "torch>=2.10,<2.11",
    "triton>=3.6,<3.7; sys_platform == 'linux'",
    # flashinfer pip == default_env per L1 design §2.4 (flashinfer_pip_env is an
    # alias to default_env). Pinned to the reference profiling stack (0.6.6).
    "flashinfer-python>=0.6.4,<0.7; sys_platform == 'linux'",
    "flashinfer-cubin>=0.6.4,<0.7; sys_platform == 'linux'",
    "nvshmem4py-cu12>=0.3.0",
    # DeepGEMM FP8 grouped-GEMM kernel (grouped_gemm `deepgemm` backend) and the
    # DSA MQA-logits kernels. The commit is the one the instrumented vLLM fork
    # pins in cmake/external_projects/deepgemm.cmake, so this package and the
    # fork's `vllm.utils.deep_gemm` wrapper stay in lockstep — that wrapper now
    # only re-exports `fp8_fp4_mqa_logits`, which older DeepGEMM does not define.
    # The previous pin carried one local fix (hold the smxx layout tensors by
    # value instead of by const reference); upstream has since made the same
    # change, so nothing is lost by moving onto it. Built with
    # no-build-isolation (see [tool.uv]) since its setup.py needs env torch.
    "deep-gemm @ git+https://github.com/serendipity-zk/DeepGEMM.git@891d57b4db1071624b5c8fa0d1e51cb317fa709f",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put tests/ on sys.path so test modules can import shared helpers like
# `fixtures.gen_throughput_trace` (a committed deterministic trace generator).
pythonpath = ["tests"]
# Capability tiers (see tests/conftest.py for the auto-skip logic). Unmarked
# tests are the default `cpu` tier (deterministic, no GPU/binary).
markers = [
    "gpu: requires a CUDA device",
    "needs_binary: requires the built simulator binary (release)",
    "needs_db: requires warm profile.db rows for the config under test",
    "agent: Codex runner+judge tier (opt-in: --run-agent)",
    "bench: perf/timing, non-deterministic (opt-in: -m bench)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
