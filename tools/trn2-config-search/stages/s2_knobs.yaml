# Stage 2: one-at-a-time knob sensitivity around the stage-1 winners
# (s1_top.yaml: top 2 per workload by tok/s and by goodput@chat). Each seed is
# run as is and with each knob below moved alone.
name: s2_knobs
family: unified
workloads_file: tools/trn2-config-search/stages/workloads.yaml
seeds_file: tools/trn2-config-search/stages/s1_top.yaml
oat:
  max_batch_tokens: [512, 1024, 4096, 8192]
  region_granularity: [mixer, per_op]
  tp_collective: [all_reduce]
  moe_dispatch: [all_gather]
  ple_table_shards: [dp_group]
  prefill_buckets:
    - [512, 2048, 8192]
    - [256, 512, 1024, 2048, 3072, 4096, 6144, 8192]
  decode_buckets:
    - [8, 32, 128, 256]
    - [1, 2, 4, 8, 12, 16, 24, 32, 48, 64, 96, 128, 192, 256]
  context_buckets:
    - [32768, 131072]
    - [4096, 8192, 12288, 16384, 24576, 32768, 49152, 65536, 98304, 131072]
  gdn_prefill_impls: [[torch], [nki, torch]]
  gdn_decode_impls: [[nki], [torch, nki]]
  qsa_prefill_impls: [[nki], [torch_sparse, nki]]
  qsa_decode_impls: [[nki], [torch_sparse, nki]]
  moe_routed_impls:
    - [nki]
    - [auto, nki, nki_tkg, nki_cte]
    - [auto, nki, nki_tkg, nki_tkg_all, nki_cte, nki_cte_cf2, torch_dense, torch_gather, torch_gather_w, torch_onehot]
  moe_router_impls: [[nki_topk], [torch, torch_topk_first, torch_bf16, nki_topk]]
  moe_shared_impls: [[nki], [torch, nki]]
  hc_mix_impls: [[torch_cat], [torch, torch_cat]]
  head_impls: [[nki], [torch, nki]]
