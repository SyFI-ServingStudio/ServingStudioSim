# Stage 1: layout screen. Every structurally valid layout of a 32- or 64-core
# replica, crossed with the two TP collectives, the two MoE dispatches and the
# mixer / layer region granularities, at the default impls and buckets and
# 2048-token chunks. probe drops what the HBM check refuses or lacks rows.
name: s1_layout
family: unified
workloads_file: tools/trn2-config-search/stages/workloads.yaml
base: {max_batch_tokens: 2048}
layouts: auto
layout_ranks: [32, 64]
grid:
  tp_collective: [all_reduce, reduce_scatter_all_gather]
  moe_dispatch: [all_gather, all_to_all]
  region_granularity: [mixer, layer]
