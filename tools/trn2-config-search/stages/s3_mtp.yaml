# Stage 3b: MTP (speculative) on the stage-3a style config, k = 1..4, at three
# MTP acceptance rates (0.71 = the flashnext CPU reference's top-1 acceptance).
name: s3_mtp
family: mtp
workloads_file: tools/trn2-config-search/stages/workloads.yaml
accept_rates: [0.5, 0.71, 0.85]
base:
  region_granularity: layer
  tp_collective: reduce_scatter_all_gather
  moe_dispatch: all_to_all
  max_batch_tokens: 2048
  context_buckets: [4096, 8192, 12288, 16384, 24576, 32768, 49152, 65536, 98304, 131072]
layouts: [dp4-tp8-g8-ep32-mt1, dp8-tp4-g4-ep32-mt1, dp2-tp8-g16-ep32-mt1]
grid:
  draft_tokens: [1, 2, 3, 4]
