          explanation: |
            **`FreshRequestSlotAdmission` 是 `SlotPipelineAdmission` 的具体实现,演示两级:`enqueue_fresh_request` 只入 FIFO 队(盖 `Pending`,不碰 KV),`reserve_fitting_requests` 才对队头逐个预留满 footprint(prompt+decode)直到 KV 装不下。** 它只写两处 KV:reserve(准入)与 release(取消);commit→resident 在层边界由 shell 驱动。v1 无 `PendingOrderPolicy`(AFD 走 FIFO),要加策略就像 `LocalPrefillDecodeAdmission<P>` 那样插入。

        - id: selection-policy
          title: "调度是纯子轴"
          primary:
            file: sketch/worker_v2/admission/policy/mod.rs
            range:
              start_line: 49
              end_line: 73
          explanation: |
            **调度是 admission 之下的子轴,而且 policy 自己**持有**待选队列:lifecycle 往里 `push` 一个到达,之后每次只问它要**一个头**。** 全程不碰 KV、不改资源 —— 于是 `FifoOrder` 换 `ShortestJobFirst` 依然是一次 type-param 变化,对 KV / lifecycle / shell 零影响。`AdmissionCandidate.deadline` 就是将来 SLO / priority 请求插入的接缝。

            **为什么是"自持队列"而不是"给我切片、还我全排列"。** 原先的签名是 `order(&[AdmissionCandidate]) -> Vec<usize>`,它**强制**调用方物化整个 backlog 并要求实现方返回一个拥有所有权的全排列 —— 而 `form_batch` 每个模拟迭代跑一次,却只用 `order.first()`。每迭代的账:一次 `Vec<AdmissionCandidate>` 堆分配 + N 次 store 索引 + 再一次 `Vec<usize>` 堆分配(`FifoOrder` 也逃不掉)+ SJF 的 O(N log N) 排序 + 结尾 `pending.retain(|rid| !admitted.contains(rid))` 的 O(N×M) 扫描。**为选 1 个元素做 3 遍全量遍历 + 2 次分配。**

            更糟的是病态情形恰好是饱和情形:backlog 深 + KV 满 → 全量重建排序 → 一个都准入不进 → `form_batch` 返回 false → 下个 tick 原样再来。而生产代码 `worker/unified_iter.rs` 做的是 `pending_prefills.front()`,**O(1) 零分配** —— sketch 当时是一次相对生产的性能回归,且 sketch 是迁移蓝图,不能这样迁进去。

            自持队列把这笔账拆干净:[`FifoOrder` = `VecDeque`](code-ref:fifo-queue)(push/peek/pop 全 O(1),与生产同成本),`ShortestJobFirst` = `BinaryHeap`(push/pop O(log N),peek O(1),**永不重排**,见下一步)。store 查找搬到 `accept_message`,于是是"每请求一次"而非"每 pending 请求每迭代一次";`retain` 整条消失(pop 即出队)。关键性质是:**若某个 policy 的排序真的依赖每迭代变化的状态(deadline 相对时钟的 slack、KV 压力、随缓存填充而变的前缀命中),它可以在自己的 `peek` 里重算 —— 代价落在需要它的那个 policy 身上,而不是让所有 policy 替最贵的那个买单。**
          related:
            - id: fifo-queue
              title: "FifoOrder —— 队列即顺序,与生产 pending_prefills.front() 同成本"
              location:
                file: sketch/worker_v2/admission/policy/fifo.rs
                range:
                  start_line: 16
                  end_line: 58

        - id: shortest-job
          title: "具体 policy:只读 AdmissionCandidate,增量维序"
          primary:
            file: sketch/worker_v2/admission/policy/shortest_job_first.rs
            range:
              start_line: 66
              end_line: 101
          explanation: |
            **`ShortestJobFirst` 坐实"纯 swap":它只读 lifecycle 在到达时算好的 `prompt`/`decode`,按总工作量升序出队。** 无 store 访问、无 lifecycle 改动 —— 一个 worker 从吞吐向 FIFO 切到延迟向 SJF,只靠 `P` 这个类型参数。这就是 census 里 `<FifoOrder>` / `<ShortestJobFirst>` 两行断言背后的全部代价。

            顺序由 [`ShortestWorkFirst` 的 `Ord`](code-ref:by-work) **增量**维持,不是每迭代重排:`BinaryHeap` 是大顶堆,所以 `Ord` 写成**反向**(`other.cmp(self)`),并用 `arrival_seq` 破平局 —— 逐字复现原先 stable sort 的 FIFO tie-break,**出队顺序与旧实现一致**,只是从 O(N log N)/迭代摊销成了 O(log N)/请求。`remove`(取消)是唯一的 O(n):`BinaryHeap` 没有按键删除,只能过滤重建 —— 可以接受,因为那是罕见控制路径,而每迭代的队头路径才是热路径。
          related:
            - id: by-work
              title: "ShortestWorkFirst::Ord —— 反向比较 + arrival_seq 破平局"
              location:
                file: sketch/worker_v2/admission/policy/shortest_job_first.rs
                range:
                  start_line: 20
                  end_line: 53

        - id: policy-working-set
          title: "ChunkedPrefillAdmission:多个 prefill,至多一个跨轮 chunk"
          primary:
            file: sketch/worker_v2/admission/chunked_prefill_admission.rs
            range:
              start_line: 36
              end_line: 49
          explanation: |
            **一个 partition 的同一 iteration 可以包含多个 prefill,但跨 iteration 延续的 partial prefill 至多一个。** `policy` 持有所有尚未开始的 fresh 请求;`active_chunk: Option<AdmissionCandidate>` 只持 token budget 边界切出的唯一 continuation。下一轮先续这个 chunk,若完成后仍有预算,再从 policy 队头装入若干完整 prefill,最后仍至多留下一个新的 partial。

            因而 `ChunkedPrefillAdmission<ShortestJobFirst>` 的准确含义是"最短的 fresh 作业下一个开始":SJF 增量维护 pending 顺序,却不能抢占 `active_chunk`。这也保持了单一 membership owner —— fresh 在 policy,已准入的 continuation 在 lifecycle/KV,没有一份排干后又混装 fresh 与 partial 的第二队列。

