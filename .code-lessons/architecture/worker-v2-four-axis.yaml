schema_version: 1

lesson:
  id: worker-v2-four-axis
  title: "worker_v2 —— 四轴 worker 组合抽象导览"
  description: >
    按真实代码读懂 L5 worker 重设计在 sketch/worker_v2 里的编码方式:一个 worker
    如何拆成四根正交轴(KV / admission / execution / cadence-shell),为什么编译期
    census 就是"它们能组合"的证明,以及每根轴的核心 trait 与它的多个具体 impl 各自
    长什么样。阅读顺序:先看门面(整体控制面 + 证明),再按依赖序逐轴深入到 KV、
    admission、IterModelExecution,最后到持有 FSM 的 shell 与四种 cadence。代码注释与标识符
    保留英文原文。

  metadata:
    type: architecture
    lifecycle: permanent

  chapters:
    - id: overview
      title: "第 1 章 · 形状与证明"

      steps:
        - id: axes-facade
          title: "四轴,一轴一文件夹"
          primary:
            file: sketch/worker_v2/mod.rs
            range:
              start_line: 10
              end_line: 26
          explanation: |
            **`worker_v2` 是一个纯编译实验:把一个 L5 worker 拆成四根正交轴,每轴一个文件夹** —— `kv/`、`admission/`、`execution/`,再加上持有 cadence 的 `workers/`,共享一层 `shared/` 词汇。`workers/` 内再按 cadence family 分目录,每个具体 `build_*` recipe 独占同名文件。它不接任何生产 selector,只以 `cfg(test)` 引入,目的就是让 `cargo check` 从类型上验证这些接缝能拼在一起。
          key_points:
            - 函数体是粗糙的,但每个输入/输出类型、每个对外部函数的调用都与 `simulator/src/` 逐字对齐(重新核验过,不是照抄旧 sketch)。
            - 22 个 server 覆盖 16 个不同 worker 类型,均在 `census.rs` 里被编译断言。

        - id: compose-shape
          title: "一个 worker = ⟨K, A, E⟩ 装到 shell 上"
          primary:
            file: sketch/worker_v2/workers/iter/iter_batch_worker.rs
            range:
              start_line: 53
              end_line: 65
          explanation: |
            **一个 worker 就是三元组 `⟨K, A, E⟩` 装到某个 cadence shell 上,`where` 子句就是全部契约。** `IterBatchWorker` 对 [KV](code-ref:kv-axis)(`K: KvStore + IterWorkerKv`)、[admission](code-ref:admission-axis)(`A: IterAdmission<K>`)、[execution](code-ref:exec-axis)(`E: IterModelExecution<K>`)三者泛型。关键点:admission 与 exec 把 `K` 当作**trait 参数**而非方法泛型,于是某个 impl 可以在自己的 bound 里对 `K` 追加能力要求。
          related:
            - id: kv-axis
              title: "KvStore —— 唯一跨 family 的轴"
              location:
                file: sketch/worker_v2/kv/mod.rs
                range:
                  start_line: 41
                  end_line: 69
            - id: admission-axis
              title: "IterAdmission<K> —— lifecycle 轴"
              location:
                file: sketch/worker_v2/admission/mod.rs
                range:
                  start_line: 30
                  end_line: 57
            - id: exec-axis
              title: "IterModelExecution<K> —— 执行轴"
              location:
                file: sketch/worker_v2/execution/mod.rs
                range:
                  start_line: 42
                  end_line: 56

        - id: census-mechanism
          title: "cargo check 通过 = 证明"
          primary:
            file: sketch/worker_v2/census.rs
            range:
              start_line: 45
              end_line: 52
          explanation: |
            **`cargo check` 通过本身就是"每个采样组合都合法"的证明。** `assert_iter` 和 `assert_afd_attn` 是把 `W` 约束到真实 L6 worker trait 的泛型空函数;一个[永不被调用的 `census` 函数](code-ref:census-body)用具体的 `⟨K, A, E⟩` 元组实例化它们,逼编译器在类型检查期把每一条 trait bound 兑现掉。
          related:
            - id: census-body
              title: "被采样的元组清单"
              location:
                file: sketch/worker_v2/census.rs
                range:
                  start_line: 57
                  end_line: 66

        - id: census-iter-rows
          title: "iter 家族 × 四种 KV 全断言"
          primary:
            file: sketch/worker_v2/census.rs
            range:
              start_line: 58
              end_line: 140
          explanation: |
            **普通 iter 组合仍复用 `IterBatchWorker`,但 speculative 已被 census 明确断言为独立的 `DraftVerifyWorker` 类型。** barebone、HP-DP、PD-prefill、chunked、prefix、hybrid 与 multi-model 展示 KV/admission/policy 的组合复用;speculative 则因 runtime acceptance 与 tentative KV lifecycle 改变 cadence,走单独的 S6 类型,不再伪装成 `decode_steps` 配置。
          key_points:
            - policy 交换是纯 type-param 变化,census 里表现为 `<FifoOrder>` / `<ShortestJobFirst>` 两行,无任何 lifecycle/KV/shell 改动。

        - id: census-coverage
          title: "blind test 与轴可选的家族"
          primary:
            file: sketch/worker_v2/census.rs
            range:
              start_line: 140
              end_line: 179
          explanation: |
            **最有戏的几行:展示可扩展性与"轴可选"。** `TieredMemoryKv` 两行是盲测 —— 一个全新 KV 布局不改任何既有代码就能组合,而且一个 tier-aware 的 [`TierAwareIterExecution`](code-ref:tiered-exec-def) 把它的 `K` bound 升级到 `TieredKvView` 来对 offload 计费。下方 [`BufferedFfnWorker<E>`](code-ref:ffn-only) 只用 execution 一根轴组合 —— 一个家族只取它需要的轴,`<K, A, E>` 三元组不是每个 worker 都要填满的固定形状。
          related:
            - id: tiered-exec-def
              title: "TierAwareIterExecution —— 升级到 TieredKvView 的 exec"
              location:
                file: sketch/worker_v2/execution/tier_aware_iter.rs
                range:
                  start_line: 49
                  end_line: 72
            - id: ffn-only
              title: "FfnTaskExecution —— 无 KV、无 store"
              location:
                file: sketch/worker_v2/execution/mod.rs
                range:
                  start_line: 96
                  end_line: 116

    - id: common-vocab
      title: "第 2 章 · 共享词汇"

      steps:
        - id: grouping
          title: "资源轴 ⟂ 请求轴"
          primary:
            file: sketch/worker_v2/shared/advance_scope.rs
            range:
              start_line: 9
              end_line: 23
          explanation: |
            **整套设计立足的唯一公理:资源轴(`PartitionId`)与请求轴(`AdvanceScope`)正交。** 容量问题(fits / reserve / release / pressure)以裸 partition 为键;请求推进与 input 渲染以"这次操作碰哪些 request"为键。AFD 是这条正交性的证明 —— 一个 shard partition 配三个 slot grouping;barebone 则处处退化为 `WholePartition(0)`。`AdvanceScope::RequestSubset` 显式带上 `partition`,让空 slot 也能报出自己的资源分区。

        - id: worker-ctx
          title: "组件无关的共享态"
          primary:
            file: sketch/worker_v2/shared/context.rs
            range:
              start_line: 11
              end_line: 20
          explanation: |
            **`WorkerContext` 只装"多个组件都要用、但谁都不该独占"的东西** —— worker 身份、[共享请求 slab](code-ref:shared-requests)、两个 lifecycle 日志开关。它刻意**不是**整个 `WorkerConfig`:构造期字段在 shell 的 builder 里消费掉,策略字段落在 admission 轴上。
          related:
            - id: shared-requests
              title: "SharedRequests —— 请求存储句柄"
              location:
                file: simulator/src/common/request.rs
                range:
                  start_line: 303
                  end_line: 306

        - id: token-emit
          title: "两家族共享的 token 记账原语"
          primary:
            file: simulator/src/common/request.rs
            range:
              start_line: 133
              end_line: 168
          explanation: |
            **逐 token 完成记账是 family 无关的,但真正共享的是 `RequestRecord` 的方法本身 —— `record_first_token`、`record_token`、`is_complete`。** ordinary iter、DraftVerify lifecycle 与 AFD-ffn Terminal 各自按自己的 cadence 调用这些原语,不共享一个会掩盖 completion ownership 的 wrapper。

    - id: kv-axis-chapter
      title: "第 3 章 · KV —— 唯一跨 family 的轴"

      steps:
        - id: kvstate-core
          title: "每个 impl 都要答的核心"
          primary:
            file: sketch/worker_v2/kv/mod.rs
            range:
              start_line: 41
              end_line: 69
          explanation: |
            **`KvStore` 是唯一跨家族统一的轴,每个 KV impl 都实现它。** 它的 `Footprint` 对 admission **不透明** —— prefill vs decode 的角色差异藏在 admission "传进来什么"(prefill 令 decode=0),不在 KV 里。容量问题只有一个:`fits`;没有 remaining/capacity/peak 之类标量泄漏,admission 只能通过中性的 `KvCapacityPressure` 报告去排压力序。

        - id: iter-batch-kv
          title: "iter 家族的窄查询视图"
          primary:
            file: sketch/worker_v2/kv/mod.rs
            range:
              start_line: 76
              end_line: 91
          explanation: |
            **`IterWorkerKv` 是 whole-iteration cadence(barebone/HP/PD/chunked,以及 S6 的基础视图)读取的一组窄事实**,以拥有所有权的快照返回,从不泄漏 `&Batch`。`DraftVerifyWorker` 再额外要求 `SpeculativeKv`,把 tentative proposal 生命周期作为能力加上去。

        - id: kv-capability
          title: "能力子 trait(ISP)与乘法叠加"
          primary:
            file: sketch/worker_v2/kv/mod.rs
            range:
              start_line: 151
              end_line: 164
          explanation: |
            **能力是接口隔离(ISP)子 trait:只由需要它的 impl 实现、只被需要它的轴读取。** `PrefixCacheKv` 是范例 —— 一个前缀感知的 lifecycle 把 bound 升级到 `where K: PrefixCacheKv`,能力在类型检查期被强制,而不是运行时 flag。叠加是免费的:把能力用 `+` AND 到 bound 上即可,比如 [`HandoffKv`](code-ref:held-cap) 的 hold/drop、[`ChunkedPrefillKv`](code-ref:chunked-cap) 的分块落地、[`TieredKvView`](code-ref:tiered-cap) 的分层视图可以共存,谁都不给别的 impl 强加 dummy 方法。
          related:
            - id: held-cap
              title: "HandoffKv —— PD hold/drop 能力"
              location:
                file: sketch/worker_v2/kv/mod.rs
                range:
                  start_line: 102
                  end_line: 119
            - id: chunked-cap
              title: "ChunkedPrefillKv —— 分块 prefill 能力"
              location:
                file: sketch/worker_v2/kv/mod.rs
                range:
                  start_line: 121
                  end_line: 146
            - id: tiered-cap
              title: "TieredKvView —— 分层读视图"
              location:
                file: sketch/worker_v2/kv/mod.rs
                range:
                  start_line: 200
                  end_line: 220

        - id: kv-leaf
          title: "唯一的真实 leaf,其余都包它"
          primary:
            file: sketch/worker_v2/kv/full_attn.rs
            range:
              start_line: 55
              end_line: 69
          explanation: |
            **`FullAttnKv` 是唯一的真实 leaf —— 其它每个 KV impl 都是它的薄壳。** 它每个 partition 持有真实共享 `Batch`,外加 `promised` 预留账本、`held` 账本(PD)、`KvAdmission` 门与占用 `sampler`,所以 `fits` / `reserve` / `advance` 逐字复用生产计费。它产出的 [`FullAttentionKvFootprint`](code-ref:full-footprint) 不预先求和,好让 `fits` 直接调真实的 `KvAdmission::try_admit`。
          related:
            - id: full-footprint
              title: "FullAttentionKvFootprint —— 不透明货币"
              location:
                file: sketch/worker_v2/kv/full_attn.rs
                range:
                  start_line: 20
                  end_line: 53

        - id: kv-wrapper
          title: "新 KV 变体 = 壳 + 一个读视图(tiered)"
          primary:
            file: sketch/worker_v2/kv/tiered.rs
            range:
              start_line: 27
              end_line: 53
          explanation: |
            **一个新 KV 变体以"壳 + 一个读视图 + 一行 census"进入,不碰任何既有函数体。** `TieredMemoryKv` 包住一个用**总容量(fast + slow)**构造的 `FullAttnKv`,于是每个 `KvStore` / `IterWorkerKv` 方法都纯委托、`fits`/`reserve` 无需改;唯一新增代码是 [`resident_by_tier`](code-ref:resident-by-tier) —— tier-aware cost model 能据以计费的 fast/slow 切分。
          related:
            - id: resident-by-tier
              title: "resident_by_tier —— 唯一新增方法"
              location:
                file: sketch/worker_v2/kv/tiered.rs
                range:
                  start_line: 135
                  end_line: 146

        - id: kv-wrap-prefix
          title: "prefix 壳:partition-local probe + sticky placement"
          primary:
            file: sketch/worker_v2/kv/mod.rs
            range:
              start_line: 147
              end_line: 172
          explanation: |
            **`PrefixCacheKv` 返回 partition-local 的 `PrefixPlacementProbe`:命中量与 opaque footprint 来自同一次 cache snapshot,避免"在 A partition 探测、拿 B partition 的 footprint 准入"。** [`PrefixPrefillDecodeAdmission` 的 placement](code-ref:prefix-placement)遍历可容纳的 partitions,先选 reusable prefix 更多者,再用 normalized KV pressure 破平局;`reserve(req, chosen_partition, footprint)` 随后把 request→partition 固化,收尾逐 partition 推进,因此 prefill、decode、release 保持 sticky。

            容量语义要分开看:**prefix storage 与 request KV 共用同一个 HBM capacity gate**,但当前 sketch 没有 radix index/refcount/replacement ledger,所以 `cached_prefix` 仍按 request 保守地重复计费,尚未模拟真正的共享块。这个 fidelity 缺口留在 KV impl 内,不污染 Admission/Shell 抽象。
          related:
            - id: prefix-placement
              title: "PrefixPrefillDecodeAdmission —— probe、fits、pressure 后选择 partition"
              location:
                file: sketch/worker_v2/admission/prefix_prefill_decode_admission.rs
                range:
                  start_line: 37
                  end_line: 86

        - id: kv-wrap-hybrid
          title: "hybrid 壳:per-kind advance 不对称"
          primary:
            file: sketch/worker_v2/kv/hybrid.rs
            range:
              start_line: 114
              end_line: 132
          explanation: |
            **`HybridStateKv` 把 full-attention 交给内层 `Batch`(每 token +1),另立一个 recurrent 侧账本(定长 +0)—— 这个 per-kind advance 不对称就是混合模型本身。** `commit_resident` 让全注意力部分进真实 decode 集,同时给 recurrent 账本插一条定长条目;`advance` 只增长内层 `Batch`,从不碰 recurrent。那份定长态经 [`footprint` 的 fixed_state 分量](code-ref:hybrid-footprint)占住池子,而 [`HybridKvView`](code-ref:hybrid-view) 把两种 kind 的长度都暴露给 report/estimator。

            **别把"增长率不同"读成"要两个池"** —— 它们正交。增长差异已经在 `advance` 里表达完了;容量侧共用一个池是因为物理上就是一块 HBM(recurrent 态占的每一 byte 就是 attention KV 拿不到的 byte),分成两个独立预算反而会 over-commit。真正需要第二个池的只有三种情况:静态 carve-out、硬 state-slot 上限、单位不可换算 —— 那时在 `fits` 里加一个 `&&` 条件,仍然全在本文件内,worker/admission/shell 一个字节不动。

            **但同一个池不等于可以直接 delegate `fits`** —— 见[下一步](code-ref:hybrid-fits)。
          related:
            - id: hybrid-footprint
              title: "footprint:recurrent 态进 fixed_state 槽(不是 prefix 槽)"
              location:
                file: sketch/worker_v2/kv/hybrid.rs
                range:
                  start_line: 77
                  end_line: 88
            - id: hybrid-fits
              title: "fits —— 唯一一个不能直接 delegate 的壳"
              location:
                file: sketch/worker_v2/kv/hybrid.rs
                range:
                  start_line: 91
                  end_line: 107
            - id: hybrid-view
              title: "HybridKvView —— 两种 kind 的长度视图"
              location:
                file: sketch/worker_v2/kv/hybrid.rs
                range:
                  start_line: 184
                  end_line: 197

        - id: kv-wrap-ledger-rule
          title: "壳的判别式:自带资源账本 ⇒ delegate 必假"
          primary:
            file: sketch/worker_v2/kv/hybrid.rs
            range:
              start_line: 91
              end_line: 107
          explanation: |
            `HybridStateKv::fits` 是全部五个 KV 里**唯一**不能写成 `self.inner.fits(..)` 的。原因是一条可复用的判别式:

            > **wrapper 自己存了"占地方的东西"(资源账本)⇒ delegate 必然是假的;只存配置 / 阈值 / 路由 ⇒ delegate 成立。**

            对照三个壳:`TieredMemoryKv` 把 `fast + slow` 在**构造时**折进 inner 的 capacity,自己只留一个只读阈值;`ModelPartitionedKv` 一 model 一 partition,自己只存路由;`ModeledPrefixCacheKv` 只存一个命中率配置,它的贡献全部走 footprint。三者 delegate 都是真的。只有 `HybridStateKv` 存了 `recurrent` 这本**真实占用**的账。

            它会错在哪、错多少:候选自己的 recurrent 态确实经 `footprint.fixed_state` 进了门,`reserve` 也把它记进了 `promised`。但 [`commit_resident`](code-ref:commit-drops-it) 一执行,`promised.remove(&req)` 把它清掉,而传给 `finalize_to_decode` 的 `initial_kv` 是 admission 算的 `prompt + prefix_kv`、**不含 recurrent** —— 于是那份 token 离开 `promised`、从未进 `active_kv`,`try_admit` 从此看不见它。**每多一个常驻请求就超发一份 state**。

            修法是照抄 inner 自己的 `held` 账本:`held` 也是"占了池子但不在 `active_kv` 里"的量,`FullAttnKv::fits` 早就把它加进 `group_promised`。所以开一个 [`fits_with_extra_occupied`](code-ref:fits-extra) 缝,`FullAttnKv::fits` 传 0,`HybridStateKv` 传 `partition_recurrent(partition)`。不会重复计数:一个请求要么在 `promised`、要么在 `recurrent`,`commit_resident` 是交接点,不重叠。
          related:
            - id: commit-drops-it
              title: "commit_resident —— token 消失的那一行"
              location:
                file: sketch/worker_v2/kv/full_attn.rs
                range:
                  start_line: 181
                  end_line: 193
            - id: fits-extra
              title: "fits_with_extra_occupied —— 给兄弟账本开的缝"
              location:
                file: sketch/worker_v2/kv/full_attn.rs
                range:
                  start_line: 110
                  end_line: 145

    - id: admission-axis-chapter
      title: "第 4 章 · Admission —— lifecycle × selection"

      steps:
        - id: admission-trait
          title: "over &mut K 的 per-family lifecycle"
          primary:
            file: sketch/worker_v2/admission/mod.rs
            range:
              start_line: 31
              end_line: 61
          explanation: |
            **`IterAdmission<K>` 是 iter 家族的 lifecycle —— `accept_message` → `form_batch` → `complete_iteration` —— 并把 `K` 当 trait 参数。** 正因 `K` 是类型参数,某条 lifecycle 才能在 impl 块里要求一个能力:[`PrefillHandoffAdmission` 要 `K: HandoffKv`](code-ref:kv-held),好让它的 `ReleaseKv` 消息经 `accept_message` 拿到的 `&mut K` 去 drop 一个 held 预留 —— 这是只收消息的 accept 做不到的。
          related:
            - id: kv-held
              title: "HandoffKv —— PrefillHandoffAdmission 要求的能力"
              location:
                file: sketch/worker_v2/kv/mod.rs
                range:
                  start_line: 102
                  end_line: 119

        - id: prefill-decode-formbatch
          title: "参考 lifecycle:form_batch"
          primary:
            file: sketch/worker_v2/admission/local_prefill_decode_admission.rs
            range:
              start_line: 124
              end_line: 175
          explanation: |
            **`LocalPrefillDecodeAdmission<P>` 是参考 lifecycle;`form_batch` 演示了准入的标准编排:取队头 → `kv.fits` → `kv.reserve`,并对 N 个分区通用。** 候选事实在 `accept_message`(到达)就冻结好了,`form_batch` 只跟 [policy 队列的头](code-ref:policy-order)打交道:`peek()` 看一眼、过了 token 预算 + KV 门才 `pop()`;被拒的头**留在队里**(peek 不出队)。`LoadBalance` 决定新 prefill 落哪个 DP shard —— 于是 barebone(N=1, `Single`)与 HP/DP(N, `RoundRobin`)共用同一段代码,N=1 时逐字等价。

            两个分支的区别只是**取几个头**:`None` 取一个;`Some(budget)` 用 `while let Some(cand) = peek()` 一直取到预算或 KV 门首次挡住为止。注意**尾部从不被检视**——这正是下面那条性能规律的来源。
          related:
            - id: policy-order
              title: "PendingOrderPolicy —— policy 自持队列,只给一个头"
              location:
                file: sketch/worker_v2/admission/policy/mod.rs
                range:
                  start_line: 49
                  end_line: 73

        - id: prefill-decode-complete
          title: "参考 lifecycle:complete_iteration"
          primary:
            file: sketch/worker_v2/admission/local_prefill_decode_admission.rs
            range:
              start_line: 161
              end_line: 227
          explanation: |
