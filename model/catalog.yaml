  family: Qwen
  checkpoint: Qwen/Qwen3-235B-A22B-Thinking-2507-FP8
qwen3_coder_480b:
  name: Qwen3 Coder 480B-A35B
  family: Qwen
  checkpoint: Qwen/Qwen3-Coder-480B-A35B-Instruct
qwen3_6_35b_a3b_fp8:
