# Reader-facing name of each arch type a public preset uses, for the public
# site. The name says how the model is deployed (engine, parallelism, decoding);
# the checkpoint, its precision and the GPU are named elsewhere on the page.
# Keyed by the arch's `type` tag (`simulator list-params`); every arch a public
# preset uses needs one (tests/test_public_presets.py).
llama3_dense:
