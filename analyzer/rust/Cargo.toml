[package]
name = "analyzer"
version = "0.1.0"
edition = "2021"
description = "VibeSim post-sim analyzer — DataFusion parquet scan → report + plot-payload JSON"
# Licensed under the root LICENSE (PolyForm Noncommercial 1.0.0 OR PolyForm
# Internal Use 1.0.0); not published to crates.io.
license-file = "../../LICENSE"
publish = false

[lints]
workspace = true

[[bin]]
name = "analyze"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1"
# DataFusion drives the parquet scan / filter / grouped aggregation. arrow-array
# is pinned to the version DataFusion 45 re-exports so downcasts on its
# RecordBatches resolve to the same arrow types (matches ref/moesim-rs analyze-rust).
datafusion = { version = "45", default-features = false, features = ["parquet"] }
arrow-array = { version = "54", default-features = false }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
# The first UI wiring slice exposes only a read-only run catalog. Axum owns the
# small HTTP surface; filesystem discovery remains explicit in this crate.
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
# Pure-Rust linear algebra — used only by `src/pca.rs` for the symmetric
# eigendecomposition behind the kernel-input-distribution feature projection
# (no BLAS/LAPACK system dependency; keeps the analyzer a self-contained build).
nalgebra = "0.33"
# Perfetto trace export: prost encodes the generated proto types to protobuf;
# flate2 gzips the result into a `.pftrace.gz`. The proto types are codegen'd at
# build time from `proto/perfetto_trace.proto` by `build.rs` (prost-build).
prost = "0.13"
flate2 = "1"
futures-util = "0.3"

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
arrow-schema = { version = "54", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow"] }

# Build profiles (release / maxperf) come from the workspace root Cargo.toml and
# apply to every member — defining them here would be ignored (cargo warns).
