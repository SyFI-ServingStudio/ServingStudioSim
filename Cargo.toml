[package]
name = "simulator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "simulator"
path = "simulator/src/main.rs"

[lib]
path = "simulator/src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

# Arrow schema definitions. parquet writers + arrow-array land in Phase 3
# when log/parquet.rs lands; for now only the Schema definitions need to
# compile.
arrow-schema = { version = "54", default-features = false }

[workspace]
