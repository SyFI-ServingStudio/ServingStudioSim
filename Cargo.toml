[package]
name = "simulator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "simulator"
path = "simulator/src/main.rs"

[lib]
path = "simulator/src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
# `rc` enables Serialize/Deserialize for the `Arc<str>` name on `LookupResult`
# (cheap clone on the hot lookup path — see timing/result.rs).
serde = { version = "1", features = ["derive", "rc"] }
# `preserve_order` keeps `Map` insertion order (it backs Value::Object with an
# IndexMap instead of the default BTreeMap). Needed so `list-params` emits the
# `pool_fragments` block in declaration order (Model→Parallelism→Workload→Io),
# which `list-params --human` prints verbatim as its group headings.
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
pyo3 = { version = "0.20", features = ["auto-initialize"] }

# Arrow schemas + arrays + parquet writer for the L7 streaming parquet logs
# (request_state / request_slo). ZSTD compression matches ref/moesim-rs.
arrow-schema = { version = "54", default-features = false }
arrow-array = { version = "54", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow", "zstd"] }

# Single-round trace CSV parsing (L7-γ TraceFrontend).
csv = "1"

# Timed/leveled logging facade (matches ref/moesim-rs): sim-time heartbeats,
# cache-build progress, end-of-run summary. `RUST_LOG` controls verbosity.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# In-tree proc-macro crate that powers `#[derive(SweepCoords)]` on per-kernel
# Input structs (see simulator/src/timing/kernels/engine.rs).
timing-kernel-derive = { path = "simulator/timing-kernel-derive" }

# In-tree proc-macro crate that powers `#[derive(DeploymentParams)]`, generating
# a deployment's `ParamDef` schema slice from its clap `Args` struct so the CLI
# surface and `list-params` schema cannot drift (design §1.8.3/§1.8.4).
schema-derive = { path = "simulator/schema-derive" }

[dev-dependencies]
# Temp dirs/files for L7 frontend + tick-driver + parquet writer tests.
tempfile = "3"
# Statistical microbenchmark harness for the cache-lookup hot path
# (benches/cache_lookup.rs). `default-features = false` drops the plotters/rayon
# pulls; we only need the sampling + confidence-interval estimates.
criterion = { version = "0.5", default-features = false }

# Hot-path cache-lookup microbenchmark (1D linear / 1D direct / 2D bilinear over
# the real attention sweep grids). `harness = false` hands main() to criterion.
[[bench]]
name = "cache_lookup"
harness = false

# Build profiles mirror ref/moesim-rs. `release` is the everyday run profile:
# thin LTO + baked-in debuginfo so `perf` resolves the heavily-inlined tick loop
# directly (no separate profiling build). `maxperf` (fat LTO, codegen-units = 1)
# is for benchmarks / long experiment runs: `cargo build --profile maxperf`.
[profile.release]
lto = "thin"
codegen-units = 16
debug = true
split-debuginfo = "unpacked"

[profile.maxperf]
inherits = "release"
lto = true
codegen-units = 1
split-debuginfo = "off"

# Optimize dependencies even in dev/test builds so unoptimized deps don't
# dominate the tick loop during `cargo test`.
[profile.dev.package."*"]
opt-level = 2

[workspace]
members = ["simulator/timing-kernel-derive", "simulator/schema-derive"]
