# Our GLM-5.3-Flash NVFP4 + DFlash2 (7 draft tokens) design on 8x B200: attention DP8 with the
# KDA layers tensor-parallel over groups of kda_tp_gpus GPUs, MoE EP8 behind the fixed-pattern
# MNNVL exchange, the fused routed MoE, RecoverSSM with the persistent conv+verify and commit
# kernels, the fused DSA chain and draft chain. The arch type fixes every mechanism (its module
# doc lists them); only the KDA group size is a choice, and the fastest one falls with load.
# Routing as in glm53_flash_vllm_nvfp4_dp_attn_ep_moe_dflash2.
