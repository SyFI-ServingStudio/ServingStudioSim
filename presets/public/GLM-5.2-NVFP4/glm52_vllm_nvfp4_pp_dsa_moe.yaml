# Each stage's GPU owns all 256 experts (EP1), so the popularity is an EP1 capture:
# SGLang TP4 without expert parallelism.
checkpoint: nvidia/GLM-5.2-NVFP4
gpu: NVIDIA B200
arch:
  type: glm52_vllm_nvfp4_pp_dsa_moe
  fp8: false
  pp_size: ${pp_size}
  max_model_len: ${max_model_len}
  routing: ${routing}
  expert_popularity_file: ${expert_popularity_file}
sweep:
  pp_size: [4, 8]
  max_model_len: [8192, 65536, 131072, 262144, 524288, 1048576]
compound:
  workload:
    diverse_100:
      routing: popularity
      expert_popularity_file: hf://datasets/UW-SyFI/servingstudio-workload@c3f5ecaab0bbff757c64864bf2ec24f5e1f76b5c/glm52_nvfp4/sglang/diverse_100/capture/20260829/popularity.json
