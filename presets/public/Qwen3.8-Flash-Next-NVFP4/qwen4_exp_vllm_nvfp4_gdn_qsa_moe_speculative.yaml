# --max-num-seqs 256, --kv-cache-dtype fp8, indexer_kv_dtype fp8, prefix caching on,
# FULL_AND_PIECEWISE). cudagraph_capture_sizes is the capture's list: vLLM's own up to
# 2048, which is also the chunk. The linears' precisions come from the checkpoint's
# quantization_config; `fp8` is not read.
