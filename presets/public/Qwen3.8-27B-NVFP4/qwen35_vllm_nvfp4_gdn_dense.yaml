# vLLM nvidia/Qwen3.8-27B-NVFP4 on one B200: 48 Gated DeltaNet + 16 gated-GQA layers
# (FP8 per-tensor projections, FlashInfer trtllm-gen attention over an FP8 KV cache),
# dense NVFP4 SwiGLU MLPs and an NVFP4 lm_head, as the diverse_100 capture's server ran
# (vLLM fork 892da082: --max-model-len 131072, --max-num-batched-tokens 2048,
# --max-cudagraph-capture-size 2048, FULL_AND_PIECEWISE). cudagraph_capture_sizes is
# vLLM's list for that cap. The linears' precisions come from the checkpoint's
# quantization_config; `fp8` is not read.
checkpoint: nvidia/Qwen3.8-27B-NVFP4
gpu: NVIDIA B200
arch:
  type: qwen35_vllm_nvfp4_gdn_dense
  fp8: false
  max_model_len: 131072
  cudagraph_capture_sizes: [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120,
                            128, 136, 144, 152, 160, 168, 176, 184, 192, 200, 208, 216, 224, 232,
                            240, 248, 256, 272, 288, 304, 320, 336, 352, 368, 384, 400, 416, 432,
                            448, 464, 480, 496, 512, 528, 544, 560, 576, 592, 608, 624, 640, 656,
                            672, 688, 704, 720, 736, 752, 768, 784, 800, 816, 832, 848, 864, 880,
                            896, 912, 928, 944, 960, 976, 992, 1008, 1024, 1040, 1056, 1072, 1088,
                            1104, 1120, 1136, 1152, 1168, 1184, 1200, 1216, 1232, 1248, 1264, 1280,
                            1296, 1312, 1328, 1344, 1360, 1376, 1392, 1408, 1424, 1440, 1456, 1472,
                            1488, 1504, 1520, 1536, 1552, 1568, 1584, 1600, 1616, 1632, 1648, 1664,
