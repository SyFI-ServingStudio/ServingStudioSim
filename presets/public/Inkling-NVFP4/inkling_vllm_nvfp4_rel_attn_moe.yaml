  workload:
    diverse_100:
      routing: corpus
      token_corpus_file: hf://datasets/UW-SyFI/servingstudio-workload@a6959f415133a183260ecba335fbdb0fb12c3db8/inkling_nvfp4/vllm/diverse_100/capture/20261009/manifest.json
