# vLLM Inkling-NVFP4 on 8 B200s: TP8 attention, dense FFN and sink experts, EP8
# routed experts over the same ranks, as the diverse_100 capture's server ran
# (logs/20261009_0_inkling_nvfp4_tp8ep8_diverse100). max_model_len sets the global
# layers' FA4 split count: 131072 is that server's --max-model-len, 1048576 the
# checkpoint's text_config.model_max_length.
# cudagraph_capture_sizes is the capture's --cudagraph-capture-sizes
# (max_cudagraph_capture_size 2048, FULL_AND_PIECEWISE).
checkpoint: thinkingmachines/Inkling-NVFP4
gpu: NVIDIA B200
arch:
  type: inkling_vllm_nvfp4_rel_attn_moe
  fp8: false
  tp_size: 8
  enable_expert_parallel: true
  max_model_len: ${max_model_len}
  routing: ${routing}
  token_corpus_file: ${token_corpus_file}
  cudagraph_capture_sizes: [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120, 128, 136,
                            144, 152, 160, 168, 176, 184, 192, 200, 208, 216, 224, 232, 240, 248, 256, 272,
                            288, 304, 320, 336, 352, 368, 384, 400, 416, 432, 448, 464, 480, 496, 512, 528,
                            544, 560, 576, 592, 608, 624, 640, 656, 672, 688, 704, 720, 736, 752, 768, 784,
                            800, 816, 832, 848, 864, 880, 896, 912, 928, 944, 960, 976, 992, 1008, 1024,
                            1040, 1056, 1072, 1088, 1104, 1120, 1136, 1152, 1168, 1184, 1200, 1216, 1232,
                            1248, 1264, 1280, 1296, 1312, 1328, 1344, 1360, 1376, 1392, 1408, 1424, 1440,
                            1456, 1472, 1488, 1504, 1520, 1536, 1552, 1568, 1584, 1600, 1616, 1632, 1648,
                            1664, 1680, 1696, 1712, 1728, 1744, 1760, 1776, 1792, 1808, 1824, 1840, 1856,
                            1872, 1888, 1904, 1920, 1936, 1952, 1968, 1984, 2000, 2016, 2032, 2048]
