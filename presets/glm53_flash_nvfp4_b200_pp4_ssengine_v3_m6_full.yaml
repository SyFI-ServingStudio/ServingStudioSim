# GLM-5.3-Flash NVFP4 prefill on one B200 PP4 pipeline as SSEngine runs it: the v3 M6 sessions, N = 300,
# full setting (HBM 100.18 GB + DRAM 50 GB + SSD 128 GB per GPU), 20 minutes.
#
# Workload: TraceLab v3 coding-agent sessions arriving at 2 per second (2,457 sessions, 260,801 rounds). The
# trace CSV is not committed (~19 MB); provision it per the create-worktree skill. Its committed manifest gives
# the source and the sha256. Decode runs elsewhere (external_decode): a round completes at its first token and
# its context is handed back.
#
# Engine choices over the PP arch's vLLM defaults:
# - layers split [12, 11, 11, 11]; no MLA layout copies; indexer logits cap 512 MB;
# - backends: FlashInfer persistent KDA prefill, Dao channel-last short conv, DeepGEMM mega mHC on every fused
#   post/pre boundary, top-k per launch the faster of DeepSelect and vLLM (packed launches on vLLM);
# - scheduler: even microbatch split (floor 512 tokens), shortest remaining prefill first across started and
#   queued prompts, load-following budget (4,096 tokens up to 1M backlog, max_batch_tokens 32,768 at 3M), any
#   request waiting 60 s scheduled first;
# - tiers: HBM -> DRAM -> SSD victim chain (DRAM exclusive of HBM, SSD written with what DRAM evicts), a staged
#   loading area of 10% of HBM, reads that would start more than 1 s out passed over.
# The one-request 8k prefill under these choices is presets/predict_glm53_flash_nvfp4_b200_pp4_ssengine.json.
deployment: pp

workload:
  trace_files:
    - trace/sessions_2ps_v3.csv
  input_file_format: text-generation-session-execution-v2
  arrival_mode: trace_timed
  request_rate: 1.0
  max_concurrency: 300
  run_to_end: false
  duration_ms: 1200000.0

io:
  log_dir: logs/glm53_flash_nvfp4_b200_pp4_ssengine_v3_m6_full

pools:
  stage:
    groups:
      - gpu: NVIDIA B200
        replicas: 1
        arch:
          type: glm53_flash_vllm_nvfp4_pp_kda_dsa_moe
          model_config: model/config/glm53_flash_nvfp4.json
          fp8: false
          pp_size: 4
          layer_partition: [12, 11, 11, 11]
          max_model_len: 1048576
          mla_layout_copies: false
          indexer_max_logits_mb: 512
          routing: corpus
          token_corpus_file: hf://datasets/UW-SyFI/servingstudio-workload@c3f5ecaab0bbff757c64864bf2ec24f5e1f76b5c/glm53_flash_fp8/vllm/balanced_c32/capture/20260924/manifest.json
        worker:
          type: pipeline_chunked_prefill
          max_batch_tokens: 32768
          gpu_time_multiplier: 1.0
          prefill_chunk_alignment: plain
          attn_gpu_memory_gb: 100.18
          external_decode: true
          dram_tier_gb: 50.0
          dram_tier_gb_per_s: 50.0
          dram_tier_writes: hbm-evictions-exclusive
          ssd_tier_gb: 128.0
          ssd_tier_gb_per_s: 10.0
          ssd_tier_writes: dram-evictions
          prefix_tier_warm_start: false
          prefix_tier_max_read_wait_ms: 1000.0
          prefix_tier_balanced_load: true
          prefix_tier_loading_area: 0.1
          force_schedule_after_ms: 60000.0
          microbatch_split: even
          min_microbatch_tokens: 512
          long_prefill_token_threshold: 0
          pending_order: shortest-prefill-first
          load_budget_low_tokens: 4096
          load_budget_backlog_lo_tokens: 1000000
          load_budget_backlog_hi_tokens: 3000000
          srpt: true

backends:
  stage/pp.first_kda_dense.kda.chunk_prefill: [flashinfer_cute_persistent]
  stage/pp.kda_dense.kda.chunk_prefill: [flashinfer_cute_persistent]
  stage/pp.kda_moe.kda.chunk_prefill: [flashinfer_cute_persistent]
  stage/pp.first_kda_dense.kda.short_conv_prefill: [dao_channellast]
  stage/pp.kda_dense.kda.short_conv_prefill: [dao_channellast]
  stage/pp.kda_moe.kda.short_conv_prefill: [dao_channellast]
  stage/pp.first_kda_dense.ffn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.kda_dense.attn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.kda_dense.ffn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.kda_moe.attn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.kda_moe.ffn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.dsa_moe.attn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.dsa_moe.ffn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.dsa_moe.dsa.indexer.topk_prefill: [deep_select, vllm_cuda]
