schema_version: 1
pack: glm52_nvfp4_b200
description: GLM-5.2 NVFP4 on B200, EP4/TP4/DP1 under vLLM. Migrated from the two accepted campaigns logs/20260827_0_glm52_nvfp4_l1_clean_alignment
  (cases 01-08) and logs/20260827_1_glm52_nvfp4_long_context_alignment (cases 09-15); every field was
  read out of those runs' own phase configs and committed traces.

# The machine that produced the accepted numbers, as facts rather than as a
# runnable config. A host profile is a local file (only hosts/example.yaml is
# tracked) because its contents are absolute paths to an HF cache and a 1 GB
# corpus -- uncommittable, and named after whoever's directory they sit in.
# These four things are what a reader actually needs to judge the numbers, and
# none of them is a path.
recorded_on:
  host: b200_raid
  gpu: NVIDIA B200
  # Relative to the host's hf_hub_root. A different snapshot is a different
  # model, so the hash is part of the result, not part of the machine.
  checkpoint_snapshots:
    glm52_nvfp4: models--nvidia--GLM-5.2-NVFP4/snapshots/aec724e8c7b8ee9db3b48c01c320f63f9cdaf8aa
  # The profiler version is an input to every measured duration.
  nsys_version: 2025.5.2
  # What `cases[].device_role` meant on that box. GPU 4 was approved but held by
  # an unrelated service, which is why the two halves are not interchangeable.
  device_roles:
    primary: '0,1,2,3'    # cases 09-15
    secondary: '4,5,6,7'  # cases 01-08

variants:
  ep4_tp4_dp1:
    deployment: unified
    gpu: NVIDIA B200
    replicas: 1
    checkpoint: glm52_nvfp4
    engine: vllm
    backend: vllm_tokens
    run_name_prefix: glm52_b200_ep4
    server:
      tp_size: 4
      dp_size: 1
      chunk_size: 2048
      max_cudagraph_capture_size: 2048
      enable_server_load_tracking: true
      extra_args:
      - --enable-expert-parallel
      - --kv-cache-dtype
      - fp8_e4m3
    arch:
      type: glm52_vllm_nvfp4_dsa_moe
      model_config: model/config/glm52_nvfp4.json
      fp8: false
      ep_size: 4
      nvl_num_gpu: 4
      routing: popularity
      expert_popularity_file: expert_popularity.json
      mtp_mode: 'off'
    worker:
      type: chunked_prefill
      max_batch_tokens: 2048
      batch_policy: mix
    profile_passes:
    - kind: nsys
      name: profile_nsys
      trace: kernel
    - kind: workload_metrics
      name: profile_workload
      trace: workload
    input_builder:
      type: vllm_text
      measured_phase: forward
      group_assignment: per_dp_rank
    label_rules: label_rules/manifest.json
cases:
