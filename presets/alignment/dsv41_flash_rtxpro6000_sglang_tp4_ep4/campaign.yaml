schema_version: 1
pack: dsv41_flash_rtxpro6000_sglang_tp4_ep4
description: >-
  DeepSeek-V4.1-Flash(-1017) on 4x RTX PRO 6000 Blackwell Server Edition (SM120, PCIe), SGLang
  v0.5.23 + the vibesim-alignment-v0.5.23 fork, TP4 attention / EP4 experts, flashinfer_mxfp4 MoE, dsv4
  attention, FP8 KV, Engram host table. Two variants -- DSpark speculative decoding (block 6, the
  2026-11-05 Decycle server) and no speculation -- so the draft cost and acceptance can be separated.
  Cases cover the operating points the SM120 graph must get right: every decode CUDA-graph size, the
  64-row decode->prefill attention switch, the 2048 chunk boundary, long-context indexer cost,
  separate-prefill-priority interference and the max_running_requests cap. Label rules are written from
  this pack's own first nsys capture (B2 rental), not migrated from the B200 vLLM pack.

recorded_on:
  host: rtxpro6000_rental
  gpu: NVIDIA RTX PRO 6000 Blackwell Server Edition
  checkpoint_snapshots:
    dsv41_flash_1017: models--deepseek-ai--DeepSeek-V4.1-Flash-1017/snapshots/<pinned at the B2 rental>
  nsys_version: 2026.4.1  # inside lmsysorg/sglang:v0.5.23-cu130
  device_roles:
    primary: '0,1,2,3'

variants:
  tp4_ep4_sglang_dspark:
    deployment: unified
    gpu: NVIDIA RTX PRO 6000 Blackwell Server Edition
    replicas: 1
    checkpoint: dsv41_flash_1017
    engine: sglang
    backend: openai
    # Runtime: the stock image lmsysorg/sglang:v0.5.23-cu130 (image checkout 297e54fd10) with the fork's
    # python/sglang mounted over /sgl-workspace/sglang/python/sglang; the host profile's fork_python is the
    # container's interpreter. The image already carries the exact FlashInfer / sgl-kernel builds, so no
    # python_runtime packages are installed. Record `pip show flashinfer-python sgl-kernel` in the run.
    python_runtime:
      lock_timeout_seconds: 3600.0
      install_timeout_seconds: 1800.0
      packages:
      - name: nvtx
        version: 0.2.16
        index_url: https://pypi.org/simple
      environment:
        FLASHINFER_DISABLE_JIT: '1'
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
    run_name_prefix: dsv41_rtxpro6000_tp4_sglang_dspark
    server:
      tp_size: 4
      dp_size: 1
      expert_parallel_size: 4
      expert_count_reduction_group_size: 1
      chunk_size: 2048
      extra_args:
      - --ep-size
      - '4'
      - --moe-runner-backend
      - flashinfer_mxfp4
      - --attention-backend
      - dsv4
      - --kv-cache-dtype
      - fp8_e4m3
      - --max-running-requests
      - '16'
      - --cuda-graph-max-bs-decode
      - '16'
      - --disable-prefill-cuda-graph
      - --speculative-algorithm
      - DSPARK
      - --speculative-dspark-block-size
      - '6'
    arch:
      type: deepseek_v41_sglang_dspark
      model_config: model/config/deepseek_v41_flash.json
      draft_tokens: 6
      fp8: true
      routing: corpus
      # Replaced by this pack's own token_corpus pass once recorded.
      token_corpus_file: hf://datasets/UW-SyFI/servingstudio-workload@c3f5ecaab0bbff757c64864bf2ec24f5e1f76b5c/deepseek_v41_flash/vllm/diverse_100/capture/20260924/manifest.json
      engram_residency: host_shared_huge
    worker:
      type: speculative
      max_batch_tokens: 2048
      draft_tokens: 6
      batch_policy: separate-prefill-priority
      max_running_requests: 16
      kv_admission_policy: bounded-future
      kv_page_size: 1
      kv_max_future_tokens: 4096
      kv_initial_new_token_ratio: 0.7
      kv_minimum_new_token_ratio: 0.098
      kv_new_token_ratio_decay_steps: 600
      kv_retract_decode_steps: 20
      decode_retraction_policy: length
    profile_passes:
    # SGLang has no token_corpus pass (vLLM only). Routing comes from EPLB's per-rebalance expert-load
    # record, which SGLang emits under EP4 (ep_size > 1).
    - kind: expert_popularity
      name: profile_popularity
      trace: workload
    - kind: workload_metrics
      name: profile_workload
      trace: workload
    - kind: nsys
      name: profile_nsys
      trace: kernel
    input_builder:
      # SGLang static verify: every decoding request runs draft_tokens + 1 = 7 query rows.
      type: speculative_engine_text
      draft_tokens: 6
      measured_phase: forward
      group_assignment: per_dp_rank
    label_rules: label_rules/manifest.json
  tp4_ep4_sglang_nospec:
    deployment: unified
    gpu: NVIDIA RTX PRO 6000 Blackwell Server Edition
    replicas: 1
    checkpoint: dsv41_flash_1017
    engine: sglang
    backend: openai
    # Runtime: the stock image lmsysorg/sglang:v0.5.23-cu130 (image checkout 297e54fd10) with the fork's
    # python/sglang mounted over /sgl-workspace/sglang/python/sglang; the host profile's fork_python is the
    # container's interpreter. The image already carries the exact FlashInfer / sgl-kernel builds, so no
    # python_runtime packages are installed. Record `pip show flashinfer-python sgl-kernel` in the run.
    python_runtime:
      lock_timeout_seconds: 3600.0
      install_timeout_seconds: 1800.0
      packages:
      - name: nvtx
        version: 0.2.16
        index_url: https://pypi.org/simple
      environment:
        FLASHINFER_DISABLE_JIT: '1'
        SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: '1'
    run_name_prefix: dsv41_rtxpro6000_tp4_sglang
    server:
      tp_size: 4
      dp_size: 1
      expert_parallel_size: 4
      expert_count_reduction_group_size: 1
      chunk_size: 2048
      extra_args:
      - --ep-size
      - '4'
      - --moe-runner-backend
      - flashinfer_mxfp4
      - --attention-backend
      - dsv4
      - --kv-cache-dtype
      - fp8_e4m3
      - --max-running-requests
      - '16'
      - --cuda-graph-max-bs-decode
      - '16'
      - --disable-prefill-cuda-graph
    arch:
      type: deepseek_v41_sglang
      model_config: model/config/deepseek_v41_flash.json
      fp8: true
      routing: corpus
      # Replaced by this pack's own token_corpus pass once recorded.
      token_corpus_file: hf://datasets/UW-SyFI/servingstudio-workload@c3f5ecaab0bbff757c64864bf2ec24f5e1f76b5c/deepseek_v41_flash/vllm/diverse_100/capture/20260924/manifest.json
      engram_residency: host_shared_huge
    worker:
      type: chunked_prefill
      max_batch_tokens: 2048
      batch_policy: separate-prefill-priority
      max_running_requests: 16
      kv_admission_policy: bounded-future
      kv_page_size: 1
      kv_max_future_tokens: 4096
      kv_initial_new_token_ratio: 0.7
      kv_minimum_new_token_ratio: 0.098
      kv_new_token_ratio_decay_steps: 600
      kv_retract_decode_steps: 20
      decode_retraction_policy: length
    profile_passes:
    # SGLang has no token_corpus pass (vLLM only). Routing comes from EPLB's per-rebalance expert-load
    # record, which SGLang emits under EP4 (ep_size > 1).
    - kind: expert_popularity
      name: profile_popularity
      trace: workload
    - kind: workload_metrics
      name: profile_workload
      trace: workload
    - kind: nsys
      name: profile_nsys
      trace: kernel
    input_builder:
      type: engine_text
      measured_phase: forward
      group_assignment: per_dp_rank
    label_rules: label_rules/manifest.json
cases:
- index: 1
  name: decode_graph_sizes_c16
  variant: tp4_ep4_sglang_dspark
  purpose: 'Decode at every captured CUDA-graph batch size (1-8, 10, 12, 14, 16) on short contexts.'
  coverage:
  - cuda_graph_boundaries
  - small_batch
  - decode
  max_model_len: 8192
  max_concurrency: 16
  profile_arrival_mode: saturated
  simulation_arrival_mode: saturated
  gpu_memory_utilization: 0.86
  capture_seconds: 15.0
  device_role: primary
  workload_trace:
    file: traces/01_decode_graph_sizes_c16.csv
    shapes:
    - [512, 256]
    - [1024, 256]
    - [2048, 256]
    repeats: 32
  speculative_acceptance:
    value: [0.8147, 0.7873, 0.9275, 0.7946, 0.8848, 0.7794]
    status: provisional
    derived_from: 'Conditional accepted-draft ratios (position 0 / verifies, then i / i-1) from the DSpark
      correct-draft histograms of the 2026-11-05 fixed-shape decode runs on this hardware (1506 verifies, mean
      3.27 accepted). Synthetic token-id prompts, so optimistic; replace with this case''s workload_metrics pass.'
    evidence: airbox-cost-calculator docs/clients/decycle/sim/kt_bench/results_sglang_4xpro6000/shapes.json
  attn_gpu_memory_gb:
    value: 6.1476
    status: provisional
    derived_from: 'Provisional: 6.1476 GB (the full pool plus the DSpark draft''s 3 fixed SWA layers) reproduces 2,929,152 full-pool tokens at 1,673.31 B/token (SGLang printed max_total_num_tokens 2,929,152 at --mem-fraction-static 0.86 with DSpark on 2026-11-05). Read back per case from the workload-only server log on the B2 rental.'
