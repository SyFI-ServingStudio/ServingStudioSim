# Names of the measured MoE routings registered runs used, as readers see them.
#
# An entry names a routing by its content, not by where a run found it: a token
# corpus by its payload checksum (`checksum_fnv1a64` in its manifest), an
# expert-popularity file by the sha256 of its bytes. `file` says where this
# repository keeps it. A name is for readers only -- no kernel-config identity
# or hash contains it -- so renaming one changes no registered config.
#
# A reader sees routings by category first: corpus, popularity, random,
# uniform. Synthetic routings (random, uniform) are named by their kind and
# seed and have no entry. `tests/test_routing_names.py` checks that every
# measured routing profile.db registers has one.
