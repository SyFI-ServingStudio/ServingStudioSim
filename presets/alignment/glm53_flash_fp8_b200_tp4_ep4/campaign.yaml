schema_version: 1
pack: glm53_flash_fp8_b200_tp4_ep4
description: GLM-5.3-Flash FP8 on B200, EP4/TP4/DP1 under vLLM (hybrid KDA + DSA, Mamba align cache mode).
  The GLM-5.2 NVFP4 fifteen-case matrix at the same shapes, repeats and concurrency; cases 14/15 pin the
  KV pool with --kv-cache-memory-bytes so their terminal-demand ratios survive the much smaller hybrid
  KV footprint, and cap --max-num-seqs at 256 because vLLM needs one Mamba cache block per decode
  sequence and the pinned pool holds only 526 / 407 of them (both cases run at most 21 concurrent requests).
recorded_on:
  host: b200_raid
  gpu: NVIDIA B200
  checkpoint_snapshots: {glm53_flash: models--zai-org--GLM-5.3-Flash/snapshots/03eb5366286afd40d2221b1d9c63a6dd1ba4832e}
  nsys_version: 2025.5.2
  device_roles: {primary: '0,1,2,3'}
variants:
  ep4_tp4_dp1:
    deployment: unified
    gpu: NVIDIA B200
    replicas: 1
    checkpoint: glm53_flash
    engine: vllm
    backend: vllm_tokens
    run_name_prefix: glm53_flash_b200_ep4
    server:
      tp_size: 4
      dp_size: 1
      expert_parallel_size: 4
      expert_count_reduction_group_size: 4
      chunk_size: 2048
      max_cudagraph_capture_size: 2048
      enable_server_load_tracking: true
      extra_args: [--enable-expert-parallel, --kv-cache-dtype, fp8_e4m3, --limit-mm-per-prompt, '{"image":0,"video":0}']
    arch:
      type: glm53_flash_vllm_fp8_kda_dsa_moe
      model_config: model/config/glm53_flash.json
      fp8: true
      tp_size: 4
      routing: corpus
      token_corpus_file: ../../../logs/20260924_1_glm53_flash_b200_tp4_ep4_corpus/profile/token_corpus/manifest.json
      cudagraph_capture_sizes: [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120,
        128, 136, 144, 152, 160, 168, 176, 184, 192, 200, 208, 216, 224, 232, 240, 248, 256, 272, 288,
        304, 320, 336, 352, 368, 384, 400, 416, 432, 448, 464, 480, 496, 512, 528, 544, 560, 576, 592,
        608, 624, 640, 656, 672, 688, 704, 720, 736, 752, 768, 784, 800, 816, 832, 848, 864, 880, 896,
        912, 928, 944, 960, 976, 992, 1008, 1024, 1040, 1056, 1072, 1088, 1104, 1120, 1136, 1152, 1168,
        1184, 1200, 1216, 1232, 1248, 1264, 1280, 1296, 1312, 1328, 1344, 1360, 1376, 1392, 1408, 1424,
        1440, 1456, 1472, 1488, 1504, 1520, 1536, 1552, 1568, 1584, 1600, 1616, 1632, 1648, 1664, 1680,
        1696, 1712, 1728, 1744, 1760, 1776, 1792, 1808, 1824, 1840, 1856, 1872, 1888, 1904, 1920, 1936,
        1952, 1968, 1984, 2000, 2016, 2032, 2048]
    # Prefill-bearing iterations cost 1.18x their pure-kernel sum: the workload-pass mixed-iteration
    # cycle ratio at multiplier 1.0, pooled over cases 01-07 (08 held out). Decode iterations stay at
    # 1.0 (0.99-1.07x in the same passes). The gap is host-side (a blocking DtoH in KDA chunk-prefill
    # setup plus ~1150 eager launches per mixed forward), so a floor would fit better than a ratio.
    worker: {type: chunked_prefill, prefill_gpu_time_multiplier: 1.18, max_batch_tokens: 2048, batch_policy: mix, kv_admission_policy: bounded-future,
      kv_page_size: 1, kv_max_future_tokens: 1, kv_initial_new_token_ratio: 0.0, kv_minimum_new_token_ratio: 0.0,
      kv_new_token_ratio_decay_steps: 1, kv_retract_decode_steps: 1, decode_retraction_policy: fcfs}
    profile_passes:
    - {kind: workload_metrics, name: profile_workload, trace: workload, warmup: true}
    - {kind: nsys, name: profile_nsys, trace: kernel, warmup: true}
    input_builder: {type: vllm_text, measured_phase: forward, group_assignment: per_dp_rank}
    label_rules: label_rules/manifest.json
