schema_version: 1
pack: qwen38_27b_nvfp4_h200_tp1
description: Qwen3.8-27B-NVFP4 (nvidia/Qwen3.8-27B-NVFP4 482ca0f3) on one H200 (Hopper), TP1, under the ServingStudio vLLM
  fork e1423a4d with FP8 KV, FP32 GDN state, prefix caching and vLLM's default max_num_seqs. A reduced pack derived from qwen38_27b_nvfp4_b200_tp1
  (cases 03, 04, 05, 11) to capture the Hopper kernel inventory and the duty-cycle factor; hand-edited, not generated by make_pack.py.
recorded_on:
  host: coriander
  gpu: NVIDIA H200
  checkpoint_snapshots:
    qwen38_27b_nvfp4: models--nvidia--Qwen3.8-27B-NVFP4/snapshots/482ca0f3832238542f8f5295dde86b5f22711d80
  nsys_version: 2025.3.2
  device_roles:
    primary: '0'
gpu_time_multiplier:
  value: 1.02157
  status: measured
  derived_from: pooled recommended_gpu_time_multiplier of this pack's four kernel alignments (cases 03, 04, 05, 11;
    sum of measured GPU cycle over sum of measured kernel time, i.e. each case's recommendation weighted by its kernel
    time; per-case 1.015-1.034), labels from this pack's SM90 rules; H200 has no diverse_100 capture. Not fitted to any
    E2E number.
  evidence: logs/20261105_hopper_pr_campaign/run-h200/<case>/analysis_kernel/reports/alignment_iteration_report.json
variants:
  tp1:
    deployment: unified
    gpu: NVIDIA H200
