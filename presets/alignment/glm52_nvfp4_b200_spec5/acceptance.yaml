# Acceptance policy for the GLM-5.2 NVFP4 B200 Spec5 matrix.
# Thresholds are inherited from the original matrix. Historical measurements
# below explain their origin only; they do not establish Spec5 accuracy or its
# causes. Current evidence is in each campaign's Analyzer reports.
#
# Tolerances only. The formulas that produce the numbers live in
# `launcher/alignment_campaign/metrics.py`: they depend on the Analyzer report
# schema, not on the model, so copying them into each pack would create N copies
# to keep in sync.
#
# Tolerances are also deliberately NOT in the golden store. Re-recording measured
# values is routine; moving the standard those values are judged against should
# be a reviewed edit to a tracked file. Sharing one store would let `--record`
# quietly change the goalposts along with the numbers.
schema_version: 1

# The report schemas these tolerances were written against. `compare` refuses to
# record a golden when a run's reports disagree, because a duration-weighted
# kernel error (schema 2+) and an unweighted per-iteration mean (schema 1) are
# different statistics, and schema 3 measures the barrier critical path rather
# than one device's; either way they would otherwise share a key.
analyzer_schema:
  iteration: 3
  e2e: 1
  workload: 1

# Fraction of a tolerance a value may consume before it is WARN rather than OK.
# One knob rather than a second threshold per metric: "close to the declared
# edge" is the actionable signal, and nobody has data to set fifteen warn bands.
warn_fraction: 0.8

tolerances:
  default:
    # Check 1 — kernel timing (tightest, most diagnostic).
    kernel_abs_pct: 5.0
    kernel_signed_pct: 5.0
    # A floor, not a bound: mapping coverage below this means a large measured
    # kernel has no simulated counterpart, which invalidates the timing above it.
    map_coverage_pct: 97.0
    # Check 2 — duty cycle. A ceiling: a large multiplier means big host bubbles
    # that deserve an explanation rather than silent absorption.
    gpu_time_multiplier: 1.5
    iteration_cycle_mean_pct: 8.0
    # Workload structure. These compare the two sides' scheduler behaviour on the
    # same trace. Where scheduling agrees they are near-exact (cases 11-15 are at
    # 0.000-0.129%), so the default stays tight on purpose: a breach says the
    # simulation executed a different iteration population, not that it mistimed
    # the one it ran, and per `skills/top-align-with-framework` that difference
    # must be reported rather than folded into the timing conclusion. The cases
    # that do diverge carry an explicit exception below.
    iterations_pct: 1.0
    prefill_tokens_mean_pct: 1.0
    decode_batch_mean_pct: 1.0
    scheduled_kv_mean_pct: 1.0
    # Check 3 — end to end (loosest). TTFT is expected to run a little fast in
    # the simulator: vLLM's async scheduler adds first-token latency that is not
    # modelled, so a small sim-faster gap is expected and is not a defect.
    output_tps_pct: 8.0
    server_ttft_mean_pct: 12.0
    server_tpot_mean_pct: 11.0
    e2e_mean_pct: 7.0

  # Every exception states why. A loosened threshold with no reason on it is
  # indistinguishable from a silently accepted regression, which is why `check`
  # rejects one without a rationale.
  per_case:
    # ── Iteration-population divergence under scheduler contention ────────────
    # First measured when this pack was built: the accepted RESULTS.md tabulated
    # workload structure for cases 11-15 only, so cases 01-10 were never held to
    # it. The divergence tracks concurrency pressure and nothing else —
    #
    #   c1 / c8 / c14 / c21 (11-15)      0.000 - 0.129%
    #   c8 / c48 / c64 / c96 (05-08)     0.025 - 0.640%
    #   c32 (03, 04)                     0.527 - 1.287%
    #   c128 / c256 (01, 02)             2.691 - 3.004%
    #   rate-driven knee (09)            3.376 - 3.494%
    #   saturated peak (10)             11.921 - 13.535%
    #
    # — which is the framework and the simulator batching the same trace into
    # different iterations once admission contends, not a cost-model error. It is
    # bounded here rather than hidden in a wider default so a change in the
    # *pattern* is still a failure.
    01_micro_throughput_c256:
      iterations_pct: 3.0
      prefill_tokens_mean_pct: 3.0
      decode_batch_mean_pct: 3.0
      scheduled_kv_mean_pct: 3.0
      rationale: >-
        Historical matrix allowance for concurrency 256 scheduler divergence.
        Spec5 kernel and workload errors require independent assessment; this
        exception does not establish that the current timing model is accurate.
    02_graph_boundaries_c128:
      iterations_pct: 3.2
      prefill_tokens_mean_pct: 3.2
      decode_batch_mean_pct: 3.2
      scheduled_kv_mean_pct: 3.2
      rationale: >-
        Historical concurrency 128: measured 2.92-3.00% iteration-population divergence, the
        same scheduler-contention effect as case 01.
    04_prefill_spectrum_c32:
      iterations_pct: 1.4
      prefill_tokens_mean_pct: 1.4
      decode_batch_mean_pct: 1.4
      scheduled_kv_mean_pct: 1.4
      rationale: >-
        Historical concurrency 32 across the 2048-token chunk boundary: measured 1.25-1.29%.
        The chunk boundary makes admission decisions differ by one chunk more
        often than the neighbouring c32 case 03, which stays under 0.55%.
    09_rate_knee:
      iterations_pct: 3.7
      prefill_tokens_mean_pct: 3.7
      decode_batch_mean_pct: 3.7
      scheduled_kv_mean_pct: 3.7
      rationale: >-
        Historical open-loop arrival at the queueing knee: measured 3.38-3.49%. This case
        also still runs on a provisional rate (see campaign.yaml), so the exact
        operating point is not yet the calibrated knee.
    06_long_long_c8:
      kernel_abs_pct: 13.5
      kernel_signed_pct: 13.5
      rationale: >-
        Historical long-prefill-plus-long-decode allowance, 12.94% in the
        original matrix. The inherited bound does not certify Spec5; inspect
        current per-operation errors and the campaign alignment review.
    10_full_saturation_rate:
      output_tps_pct: 15.0
      e2e_mean_pct: 9.0
      iterations_pct: 14.0
      prefill_tokens_mean_pct: 14.0
      decode_batch_mean_pct: 14.0
      scheduled_kv_mean_pct: 14.0
      rationale: >-
        Historical saturation finding: throughput ran +13.86% while kernel absolute
        error is only 3.63%, and the iteration population diverges by
        11.92-13.54% — the matrix's worst. At saturation the simulator admits
        work the framework does not, so it completes more tokens in fewer, fuller
        iterations. A clean tight level under a dirty loose one points at
        scheduling and admission dynamics, not at kernel cost, so the kernel
        bound is not relaxed with these. Tracing this back to admission policy is
        open work; these bounds keep it visible, they do not accept it.
    13_generation_length_matrix_c8:
      server_ttft_mean_pct: 22.0
      rationale: >-
        Historical result: -20.77% is concentrated in the initial eight-request startup cohort; over
        requests 8-23 it is -2.60%. A startup-queue effect, not a per-request
        cost miss, and the full-run E2E mean stays inside the default bound.
    15_kv_overcommit_mixed_churn_c14:
      server_ttft_mean_pct: 36.0
      rationale: >-
        Historical result: +35.14% is concentrated in the initial fourteen-request KV-overcommit
        admission cohort; over requests 14-71 it is -6.34%. An admission-tail
        effect; the full-run E2E mean stays inside the default bound.

# Drift against a recorded golden warns, never fails: goldens are monitors, and a
# cost-model change that improves a number is still a change worth seeing. The
# floor exists because alignment errors sit near zero, where a purely relative
# band would fire on noise (0.10% -> 0.13% is a 30% relative move and means
# nothing).
drift:
  relative: 0.20
  floor: 0.5
