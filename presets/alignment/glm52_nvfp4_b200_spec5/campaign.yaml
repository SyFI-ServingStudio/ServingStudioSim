schema_version: 1
pack: glm52_nvfp4_b200_spec5
description: GLM-5.2 NVFP4 with vLLM MTP spec-5 on B200, EP4/TP4/DP1. Cases 01-15
  retain the accepted non-spec workload families while distributing 2K, 4K, and 8K
  chunk ceilings across them; cases 16-17 add high-concurrency mixed 8K-boundary and
  concurrent long-prefill coverage. This is a new alignment campaign, not a new golden
  for the accepted non-spec runs.
recorded_on:
  host: b200_raid
  gpu: NVIDIA B200
  checkpoint_snapshots:
    glm52_nvfp4: models--nvidia--GLM-5.2-NVFP4/snapshots/aec724e8c7b8ee9db3b48c01c320f63f9cdaf8aa
  nsys_version: 2025.5.2
  device_roles:
    primary: 0,1,2,3
variants:
  ep4_tp4_dp1:
    deployment: unified
    gpu: NVIDIA B200
    replicas: 1
    checkpoint: glm52_nvfp4
    engine: vllm
    backend: vllm_tokens
    run_name_prefix: glm52_b200_ep4
    server:
      tp_size: 4
      dp_size: 1
      chunk_size: 2052
      max_cudagraph_capture_size: 2052
      enable_server_load_tracking: true
      extra_args:
      - --enable-expert-parallel
      - --kv-cache-dtype
      - fp8_e4m3
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":5}'
    arch:
      type: glm52_vllm_nvfp4_dsa_moe_speculative
      model_config: model/config/glm52_nvfp4.json
      fp8: false
      ep_size: 4
      nvl_num_gpu: 4
      routing: uniform
      expert_popularity_file: expert_popularity.json
      draft_expert_popularity_file: draft_expert_popularity.json
      mtp_mode: full_index
      draft_tokens: 5
    worker:
      type: speculative
      max_batch_tokens: 2052
      batch_policy: mix
      draft_tokens: 5
      acceptance_seed: 73
    profile_passes:
    - kind: workload_metrics
      name: profile_workload
      trace: workload
      warmup: true
    - kind: nsys
      name: profile_nsys
      trace: kernel
      warmup: true
    input_builder:
      type: speculative_engine_text
      draft_tokens: 5
      measured_phase: forward
      group_assignment: per_dp_rank
    label_rules: label_rules/manifest.json
