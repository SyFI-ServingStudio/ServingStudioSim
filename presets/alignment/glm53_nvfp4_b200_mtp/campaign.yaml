schema_version: 1
pack: glm53_nvfp4_b200_mtp
description: 'GLM-5.3 NVFP4 with its own MTP layer as proposer (K=3 and K=5) on B200, EP4/TP4/DP1. Token-corpus
  capture only: records body and MTP-layer expert routes for routing: corpus, on the same enwik9 workload (case
  07) as the GLM-5.3 DFlash2 corpus, so both drafters replay with equally sourced routing.'
recorded_on:
  host: cayenne
  gpu: NVIDIA B200
  checkpoint_snapshots:
    glm53_nvfp4: models--incoai--GLM-5.3-NVFP4/snapshots/54e52520606f96b3d9fc84088ad22882a61648ac
  device_roles:
    primary: 0,1,2,3
variants:
  ep4_tp4_dp1_mtp3:
    deployment: unified
    gpu: NVIDIA B200
    replicas: 1
    checkpoint: glm53_nvfp4
    engine: vllm
    backend: vllm_tokens
    run_name_prefix: glm53_b200_ep4_mtp3
    server:
      tp_size: 4
      dp_size: 1
      expert_parallel_size: 4
      expert_count_reduction_group_size: 4
      chunk_size: 2048
      max_cudagraph_capture_size: 2048
      enable_server_load_tracking: true
      extra_args:
      - --max-num-seqs
      - '256'
      - --enable-expert-parallel
      - --kv-cache-dtype
      - fp8_e4m3
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --attention-config
      - '{"sparse_mla_force_mqa": true}'
    arch:
      type: glm52_vllm_nvfp4_dsa_moe_speculative
      model_config: model/config/glm53_nvfp4.json
      fp8: false
      ep_size: 4
      nvl_num_gpu: 4
      routing: uniform
      mtp_mode: index_share
      draft_tokens: 3
    worker:
      type: speculative
      max_batch_tokens: 2048
      batch_policy: mix
      draft_tokens: 3
      acceptance_seed: 73
      kv_admission_policy: bounded-future
      kv_page_size: 1
      kv_max_future_tokens: 4
      kv_initial_new_token_ratio: 0.0
      kv_minimum_new_token_ratio: 0.0
      kv_new_token_ratio_decay_steps: 1
      kv_retract_decode_steps: 1
      decode_retraction_policy: fcfs
    profile_passes:
    - kind: workload_metrics
      name: profile_workload
      trace: workload
      warmup: true
    - kind: nsys
      name: profile_nsys
      trace: kernel
      warmup: true
    - kind: token_corpus
      name: profile_corpus
      trace: workload
    input_builder:
      type: speculative_engine_text
      draft_tokens: 3
      measured_phase: forward
      group_assignment: per_dp_rank
    label_rules: label_rules/manifest.json
  ep4_tp4_dp1_mtp5:
    deployment: unified
    gpu: NVIDIA B200
    replicas: 1
    checkpoint: glm53_nvfp4
    engine: vllm
    backend: vllm_tokens
    run_name_prefix: glm53_b200_ep4_mtp5
    server:
      tp_size: 4
      dp_size: 1
      expert_parallel_size: 4
      expert_count_reduction_group_size: 4
      chunk_size: 2052
      max_cudagraph_capture_size: 2052
      enable_server_load_tracking: true
      extra_args:
      - --max-num-seqs
      - '256'
      - --enable-expert-parallel
      - --kv-cache-dtype
      - fp8_e4m3
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":5}'
      - --attention-config
      - '{"sparse_mla_force_mqa": true}'
    arch:
      type: glm52_vllm_nvfp4_dsa_moe_speculative
      model_config: model/config/glm53_nvfp4.json
      fp8: false
      ep_size: 4
      nvl_num_gpu: 4
      routing: uniform
      mtp_mode: index_share
      draft_tokens: 5
    worker:
      type: speculative
      max_batch_tokens: 2052
      batch_policy: mix
      draft_tokens: 5
      acceptance_seed: 73
      kv_admission_policy: bounded-future
      kv_page_size: 1
      kv_max_future_tokens: 6
      kv_initial_new_token_ratio: 0.0
      kv_minimum_new_token_ratio: 0.0
      kv_new_token_ratio_decay_steps: 1
      kv_retract_decode_steps: 1
      decode_retraction_policy: fcfs
    profile_passes:
    - kind: workload_metrics
      name: profile_workload
      trace: workload
      warmup: true
    - kind: nsys
      name: profile_nsys
      trace: kernel
      warmup: true
    - kind: token_corpus
      name: profile_corpus
      trace: workload
    input_builder:
      type: speculative_engine_text
      draft_tokens: 5
      measured_phase: forward
      group_assignment: per_dp_rank
    label_rules: label_rules/manifest.json
