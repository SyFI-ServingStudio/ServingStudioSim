schema_version: 1
pack: glm53_nvfp4_b200_dflash2
description: GLM-5.3 NVFP4 with a vLLM DFlash2 proposer (7 drafted tokens) on B200,
  EP4/TP4/DP1. Cases 01-08 replay the GLM-5.2 spec5 workload families at the same
  shapes and concurrency, with chunk ceilings rounded to multiples of the verify
  width 8, so the two speculative deployments are comparable case by case.
recorded_on:
  host: b200_raid
  gpu: NVIDIA B200
  checkpoint_snapshots:
    glm53_nvfp4: models--incoai--GLM-5.3-NVFP4/snapshots/54e52520606f96b3d9fc84088ad22882a61648ac
    glm53_dflash2: models--incoai--GLM-5.3-DFlash2/snapshots/425aa615ce320caac34400208b30808c8f14f76c
  nsys_version: 2025.5.2
  device_roles:
    primary: 0,1,2,3
variants:
  ep4_tp4_dp1:
    deployment: unified
    gpu: NVIDIA B200
    replicas: 1
    checkpoint: glm53_nvfp4
    # The proposer ships as its own checkpoint; rendering writes its host path
    # into `--speculative-config`.
    draft_checkpoint: glm53_dflash2
    engine: vllm
    backend: vllm_tokens
    run_name_prefix: glm53_b200_ep4_dflash2
    server:
      tp_size: 4
      dp_size: 1
      expert_parallel_size: 4
      expert_count_reduction_group_size: 4
      chunk_size: 2048
      # The capture grid is rounded up to a multiple of the verify width 8, and
      # 2048 already is one, so the top bucket survives. Left unset, vLLM caps it
      # at 1024 on SM100 and every prefill iteration runs eager.
      max_cudagraph_capture_size: 2048
      enable_server_load_tracking: true
      # DFlash drafts 8 query rows per request into buffers sized by the
      # 2048-token budget. vLLM's default of 1024 sequences sends the startup
      # dummy run 8192 rows and fails with an index-out-of-bounds assert.
      # 2048 / 8 = 256 is also the most decode requests one step can hold, and
      # no case exceeds concurrency 256, so the cap never binds a real step.
      extra_args:
      - --max-num-seqs
      - '256'
      - --enable-expert-parallel
      - --kv-cache-dtype
      - fp8_e4m3
      - --speculative-config
      - '{"method":"dflash","num_speculative_tokens":7}'
    arch:
      type: glm53_vllm_nvfp4_dsa_moe_dflash2
      model_config: model/config/glm53_nvfp4.json
      fp8: false
      ep_size: 4
      nvl_num_gpu: 4
      routing: corpus
      token_corpus_file: hf://UW-SyFI/servingstudio-corpora@c09af698f8192222ee8852f8c727630789890310/glm53_nvfp4_dflash2/manifest.json
      draft_tokens: 7
      draft_sliding_window: 2048
    worker:
      type: speculative
      max_batch_tokens: 2048
      batch_policy: mix
      draft_tokens: 7
      acceptance_seed: 73
    profile_passes:
    - kind: workload_metrics
      name: profile_workload
      trace: workload
      warmup: true
    - kind: nsys
      name: profile_nsys
      trace: kernel
      warmup: true
    # The target's measured routing demand; the proposer is dense and routes
    # nothing. Rendered on the openai backend, the one that returns routes.
    - kind: token_corpus
      name: profile_corpus
      trace: workload
    input_builder:
      type: speculative_engine_text
      draft_tokens: 7
      measured_phase: forward
      group_assignment: per_dp_rank
    label_rules: label_rules/manifest.json
