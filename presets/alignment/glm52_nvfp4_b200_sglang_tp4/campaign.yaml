schema_version: 1
pack: glm52_nvfp4_b200_sglang_tp4
description: GLM-5.2 NVFP4 on B200, pure TP4/DP1/EP1 under SGLang. The 15-case matrix of
  presets/alignment/glm52_nvfp4_b200 (vLLM, EP4) ported to SGLang; every case keeps its name, purpose,
  coverage, concurrency, capture window, context limit and shape ladder, so the two packs measure the
  same fifteen operating points and differ only in the engine. The engine specifics were copied from
  the four accepted single-case configs in logs/20260828_0_glm52_nvfp4_pure_tp_sglang_alignment
  (profile_nsys.yaml, profile_workload.yaml, profile_popularity.yaml, simulation.yaml).

# The machine that produced these captures, as facts rather than as a runnable
# config. A host profile is a local file because its contents are absolute paths
# to an HF cache and a 1 GB corpus.
recorded_on:
  host: b200_raid
  gpu: NVIDIA B200
  # Relative to the host's hf_hub_root. The same snapshot the accepted SGLang
  # single case ran; a different snapshot is a different model.
  checkpoint_snapshots:
    glm52_nvfp4: models--nvidia--GLM-5.2-NVFP4/snapshots/aec724e8c7b8ee9db3b48c01c320f63f9cdaf8aa
  # The profiler version is an input to every measured duration.
  nsys_version: 2025.5.2
  # One role only. The vLLM matrix split its cases across two device roles and
  # ran cases 01-08 on GPUs 4-7; those devices are held by an unrelated user's
  # job, so `secondary` has no counterpart here and every case runs on 0,1,2,3.
  # `device_role` is therefore a constant in this pack, not an axis.
  device_roles:
    primary: '0,1,2,3'

variants:
  # One variant: pure tensor parallelism. Not a second entry beside the vLLM
  # pack's `ep4_tp4_dp1` because the arch tag, the engine and the backend all
  # differ -- a variant is a topology within one engine's vocabulary.
  tp4_dp1_sglang:
    deployment: unified
    gpu: NVIDIA B200
    replicas: 1
    checkpoint: glm52_nvfp4
    engine: sglang
    # `openai`, NOT `vllm_tokens`. `alignment/runner.py:96-101` appends
    # `--tokens-only` for the `vllm_tokens` backend regardless of engine, and
    # `sglang.launch_server` has no such flag; the Python backend registry has no
    # `sglang_tokens` entry to select instead.
    backend: openai
    # Keep profiling on the exact prebuilt CUDA-13 runtime used by the accepted
    # captures. The launcher verifies these artifacts before starting SGLang,
    # so a missing wheel cannot silently turn into startup-time JIT work.
    python_runtime:
      lock_timeout_seconds: 3600.0
      install_timeout_seconds: 1800.0
      packages:
      - name: nvtx
        version: 0.2.16
        index_url: https://pypi.org/simple
      - name: flashinfer-python
        version: 0.6.15.post1
        index_url: https://pypi.org/simple
      - name: flashinfer-cubin
        version: 0.6.15.post1
        index_url: https://flashinfer.ai/whl
      - name: flashinfer-jit-cache
        version: 0.6.15.post1
        local_version: cu130
        index_url: https://flashinfer.ai/whl/cu130
        required_files:
        - flashinfer_jit_cache/jit_cache/fp4_quantization_100/fp4_quantization_100.so
        - flashinfer_jit_cache/jit_cache/trtllm_comm/trtllm_comm.so
        - flashinfer_jit_cache/jit_cache/rope/rope.so
        - flashinfer_jit_cache/jit_cache/fmha_gen/fmha_gen.so
        - flashinfer_jit_cache/jit_cache/fused_moe_trtllm_sm100/fused_moe_trtllm_sm100.so
      environment:
        FLASHINFER_DISABLE_JIT: '1'
    run_name_prefix: glm52_b200_tp4_sglang
    server:
      tp_size: 4
      dp_size: 1
      # Pure tensor parallelism. SGLang's `--ep-size` defaults to 1, so this
      # config passes no expert-parallel flag at all; what it must state is the
      # resulting EP degree, because `alignment/runner.py` derives
      # `expert_parallel_size = tp_size * dp_size` when it is left unset and
      # `arch/build.rs:398 validate_expert_popularity` hard-checks that number
      # against the arch's EP degree. Under EP1 every rank holds all 256 experts
      # with moe_intermediate sharded 2048 -> 512, which is exactly what
      # `glm52_sglang_nvfp4_tp_dsa_moe` models.
      expert_parallel_size: 1
      # One SGLang scheduler event is repeated across the four TP workers; the
      # popularity recorder reduces those four copies into one logical record.
      expert_count_reduction_group_size: 4
      # --chunked-prefill-size; must match the worker's max_batch_tokens.
      chunk_size: 2048
      # No `max_cudagraph_capture_size`. It is a vLLM TOKEN ceiling and the vLLM
      # pack sets it to the chunk budget; SGLang's nearest flag,
      # `--cuda-graph-max-bs-decode`, is a REQUEST count, so forwarding 2048
      # would ask for decode graphs covering 2,048 concurrent requests and stall
      # startup indefinitely. `alignment/profiler/sglang_server.py:150-169`
      # refuses the field for engine: sglang rather than move the number between
      # units. SGLang's own decode-graph default covers this matrix.
      #
      # No `enable_server_load_tracking` either: the SGLang driver never reads
      # it, and its `/v1/loads` idle endpoint needs no launch flag.
      extra_args:
      # ServingStudioSim models FlashInfer's TRTLLM fused all-reduce -- that is what the
      # `all_reduce_fusion` / `all_reduce_residual_rms_norm` leaves were profiled
      # against, and what vLLM runs. SGLang's `auto` resolves to `mnnvl` on
      # Blackwell, a different kernel family, so pinning `trtllm` is a modeling
      # requirement rather than a workaround: aligning against mnnvl would
      # compare two different collectives.
      - --flashinfer-allreduce-fusion-backend
      - trtllm
      - --kv-cache-dtype
      - fp8_e4m3
      # `--context-length <case.max_model_len>` is appended by the renderer, not
      # authored here, exactly as `--max-model-len` is for the vLLM pack: it is
      # the same decision as `arch.max_model_len` and `workload.max_model_len`
      # and must not be able to disagree with them.
    arch:
      type: glm52_sglang_nvfp4_tp_dsa_moe
      model_config: model/config/glm52_nvfp4.json
      fp8: false
      tp_size: 4
      # No `ep_size` and no `nvl_num_gpu`: the vLLM pack's EP4 arch splits the
      # expert axis over four ranks and costs the NVLink all-to-all that split
      # implies. Under pure TP there is no expert axis to split and no expert
      # all-to-all, so both parameters are absent from this arch tag rather than
      # set to a neutral value.
      #
      # `routing: custom` loads the measured distribution from the file below.
      routing: custom
      # Pack-relative. `render.simulation_document` rewrites it to the
      # repo-relative `presets/alignment/glm52_nvfp4_b200_sglang_tp4/expert_popularity.json`
      # that the rendered simulation preset carries.
      expert_popularity_file: expert_popularity.json
      mtp_mode: 'off'
    worker:
      type: chunked_prefill
      # `chunked_prefill_size=2048` in the captured server's own argument dump.
      max_batch_tokens: 2048
      # SGLang runs an extend batch or a decode batch, never both: its
      # `get_next_batch_to_run` takes `get_new_batch_prefill`'s result if there
      # is one and only otherwise falls through to the running decode batch.
      # The captured server reports `enable_mixed_chunk=False`, the default, so
      # the mixing path is off. `mix` is the vLLM V1 scheduler, which is why the
      # vLLM pack keeps it.
      batch_policy: separate-prefill-priority
      # SGLang's scheduler admits against a bounded estimate of future decode
      # growth and retracts resident decodes if physical KV allocation can no
      # longer be satisfied. Keep the source defaults in the campaign so a
      # replay uses the same scheduler contract as the recorded baseline.
      kv_admission_policy: bounded-future
      kv_page_size: 1
      kv_max_future_tokens: 4096
      kv_initial_new_token_ratio: 0.7
      kv_minimum_new_token_ratio: 0.098
      kv_new_token_ratio_decay_steps: 600
      kv_retract_decode_steps: 20
      decode_retraction_policy: length
    # Three passes, not the vLLM pack's two, and they are not interchangeable:
    #   profile_popularity  routing counts. Required for any MoE arch, and the
    #                       only way to get one under pure TP -- SGLang's EPLB,
    #                       which normally carries the record, asserts ep_size>1.
    #                       Kept a separate pass because the recorder buffers a
    #                       per-forward histogram and all-reduces it at dump,
    #                       which has no business inside a timing measurement.
    #   profile_workload    the complete, undisturbed scheduler timeline. The
    #                       E2E authority, and where each case's real KV
    #                       capacity is read back from.
    #   profile_nsys        bounded per-kernel truth. A slice of the run that
    #                       carries capture/flush pauses, so it is never the E2E
    #                       authority.
    profile_passes:
    - kind: expert_popularity
      name: profile_popularity
      trace: workload
    - kind: workload_metrics
      name: profile_workload
      trace: workload
    - kind: nsys
      name: profile_nsys
      trace: kernel
    input_builder:
      # `engine_text`, not `vllm_text` and not `sglang_text`:
      # `launcher/alignment_config.py:191-195` accepts only the first two, and
      # `vllm_text` is the pre-SGLang alias of this same builder kept for
      # configs written against the single-engine pipeline.
      type: engine_text
      measured_phase: forward
      group_assignment: per_dp_rank
    label_rules: label_rules/manifest.json
