  - scheduler_pressure
  max_model_len: 8192
  max_concurrency: 256
  profile_arrival_mode: saturated
  simulation_arrival_mode: saturated
  gpu_memory_utilization: 0.75
  capture_seconds: 15.0
  device_role: primary
  workload_trace:
    file: traces/01_micro_throughput_c256.csv
    shapes:
    - [16, 16]
    - [32, 32]
    - [64, 64]
    - [128, 64]
    repeats: 256
  attn_gpu_memory_gb:
    # C = 485120.
    value: 26.79026688
    status: measured
    derived_from: '`max_total_num_tokens=C` in the workload-only SGLang server log; C * 220896 / 4 / 1e9.
      SGLang''s --mem-fraction-static accounts differently from vLLM''s --gpu-memory-utilization, so the
      vLLM pack''s value does not transfer and has to be read back per case: this case reads 26.79 GB
      where the vLLM matrix recorded 120.0 GB at the same 0.75 utilization.'
    evidence: logs/20260829_0_glm52_sglang_tp4_matrix/cases/01_micro_throughput_c256/profile_workload
  provenance:
    ported_from: presets/alignment/glm52_nvfp4_b200/campaign.yaml case 1
