    coverage: [prefill512, decode16, native_nrt, clean_server_timing, full32_bf16]
    max_model_len: 512
    max_concurrency: 16
    profile_arrival_mode: saturated
    simulation_arrival_mode: saturated
    gpu_memory_utilization: 0.9
    capture_seconds: 30
    device_role: primary
    workload_trace: {file: stock_16x504_8.csv, shapes: [[504, 8]], repeats: 16}
    attn_gpu_memory_gb:
      value: 7.111442432
      status: measured
      derived_from: stock model metadata; 6782 BF16 KV blocks x 1048576 bytes per TP rank
      evidence: logs/20261009_2_trainium_stock_server_timings; native model-metadata.json
    provenance:
      evidence_scope: one stock full32 BF16 TP4 C512 operating point
      corpus_recipe: python -m alignment.neuron.vllm_corpus
      policy_timing: selected after evidence; unchanged existing generic default thresholds
