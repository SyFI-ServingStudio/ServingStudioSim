# Stock vLLM Neuron TP4/LNC2 across the validated context ladder. Each context
# compiles only the decode buckets whose rows passed the unchanged vendor logit
# check and native trace coverage (see doc/trainium2.md); a decode batch pads to
# the smallest configured bucket. Residents = min(largest bucket, 217024 // context).
# Full-model native device time; HTTP/host overhead is not calibrated here.
deployment: unified
workload:
  trace_files: ["${trace}"]
  input_file_format: text-generation-independent
  arrival_mode: trace_timed
  run_to_end: true
io:
  log_dir: logs/unified_llama3_8b_vllm_neuron_ladder/{context}
  log_output_token_times: true
  log_stage_transitions: true
  kv_log_stride: 1
pools:
  main:
    groups:
      - gpu: AWS Trainium2 LNC2
        replicas: 1
        arch:
          type: llama3_vllm_neuron
          model_config: model/config/llama3_8b.json
          max_model_len: ${max_model_len}
          decode_buckets: ${decode_buckets}
          tp_size: 4
          fp8: false
        worker:
          type: chunked_prefill
          # 6782 pages * 32 tokens * 32768 bytes/token per TP rank.
          attn_gpu_memory_gb: 7.111442432
          max_batch_tokens: ${max_model_len}
          max_prefill_requests_per_iteration: 1
          max_resident_requests_per_partition: ${resident}
          batch_policy: separate-prefill-priority
          kv_admission_policy: full-footprint
          prefix_cache_mode: disabled
          gpu_time_multiplier: 1.0
compound:
  context:
    c512:
      max_model_len: 512
      decode_buckets: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
      resident: 423
      trace: trace/trainium_stock_smoke.csv
    c1024:
      max_model_len: 1024
      decode_buckets: [1, 2, 4, 8, 16, 32, 64, 128, 256]
      resident: 211
      trace: trace/trainium_stock_smoke_c1024.csv
    c2048:
      max_model_len: 2048
      decode_buckets: [1, 2, 4, 8, 16, 32, 64, 128]
      resident: 105
      trace: trace/trainium_stock_smoke_c2048.csv
    c4096:
      max_model_len: 4096
      decode_buckets: [16, 32]
      resident: 32
      trace: trace/trainium_stock_smoke_c4096.csv
    c8192:
      max_model_len: 8192
      decode_buckets: [1, 16, 32]
      resident: 26
      trace: trace/trainium_stock_smoke_c8192.csv
