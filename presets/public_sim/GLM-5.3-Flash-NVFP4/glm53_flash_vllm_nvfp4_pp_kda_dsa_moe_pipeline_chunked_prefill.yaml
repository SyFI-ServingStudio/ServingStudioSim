# vLLM GLM-5.3-Flash NVFP4 on B200, pure PP4 or PP8 (one GPU per stage, EP1), vLLM's
# default layer split, chunked prefill at 2048 tokens.
# Worker: the PR #78 Flash study,
# no alignment pack: plain prefill chunking (no vLLM Mamba align-mode chunk ends),
# gpu_time_multiplier 1.0 (pure kernel sum). Its 8192-token chunk is replaced by 2048, the chunk
# of the TP4/EP4 sibling glm53_flash_vllm_fp8_kda_dsa_moe_chunked_prefill (the captured server's,
# also its largest CUDA graph).
# attn_gpu_memory_gb: 89.13 GB, the common per-GPU KV/state budget of every Flash NVFP4 layout,
# the FP8 rule re-costed for the
# NVFP4 weights: 57.79 + (FP8 DP4/EP4 92.47 - NVFP4 DP4/EP4 61.13 GB). No NVFP4 server measured the
# activation and graph overhead; it is assumed equal to FP8's. The study's TraceLab runs used twice
# it (178.26) only so that 1M-token contexts fit.
# Every stage holds the same tokens, so the head sizes KV by the stage with the most KV bytes
# per token.
deployment: pp
pools:
  stage:
    groups:
      - replicas: ${replicas}
        arch:
          preset: glm53_flash_vllm_nvfp4_pp_kda_dsa_moe
          pp_size: ${pp_size}
          max_model_len: ${max_model_len}
        worker:
          type: pipeline_chunked_prefill
          max_batch_tokens: 2048
          prefill_chunk_alignment: plain
          attn_gpu_memory_gb: 89.13
sweep:
  replicas: [1, 2]
  pp_size: [4, 8]
  max_model_len: [8192, 131072, 524288]
