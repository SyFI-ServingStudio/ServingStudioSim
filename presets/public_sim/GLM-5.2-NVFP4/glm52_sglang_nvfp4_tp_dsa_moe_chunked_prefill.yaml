# SGLang GLM-5.2 NVFP4 on B200, TP4, chunked prefill at 2048 tokens.
# Worker: presets/alignment/glm52_nvfp4_b200_sglang_tp4 (as in
# presets/glm52_nvfp4_b200_sglang_tp4_diverse.yaml); its KV budget, 45.14 GB,
# was measured at every max_model_len here (cases 09-15).
deployment: unified
pools:
  main:
    groups:
      - replicas: ${replicas}
        arch:
          preset: glm52_sglang_nvfp4_tp_dsa_moe
          max_model_len: ${max_model_len}
        worker:
          type: chunked_prefill
          max_batch_tokens: 2048
          batch_policy: separate-prefill-priority
          kv_admission_policy: bounded-future
          kv_page_size: 1
          kv_max_future_tokens: 4096
          kv_initial_new_token_ratio: 0.7
          kv_minimum_new_token_ratio: 0.098
          kv_new_token_ratio_decay_steps: 600
          kv_retract_decode_steps: 20
          decode_retraction_policy: length
          attn_gpu_memory_gb: 45.140539392
sweep:
  replicas: [1, 2]
  max_model_len: [8192, 65536, 131072, 262144, 524288]
