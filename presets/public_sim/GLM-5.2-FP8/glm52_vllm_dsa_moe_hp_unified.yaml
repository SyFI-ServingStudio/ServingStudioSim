# vLLM GLM-5.2 FP8 on H200, DP8 attention with EP8 experts, the hp_unified
# worker, at the server of the ctx8k_out1k capture
# (20260803_8_glm52_fp8_dp8_ep8_alignment_ctx8k_out1k_c64). attn_gpu_memory_gb
# is that server's `Available KV cache memory: 5.24 GiB` per rank, in decimal
# GB: each DP rank holds the dense weights whole, which leaves little for KV.
deployment: unified
pools:
  main:
    groups:
      - replicas: ${replicas}
        arch:
          preset: glm52_vllm_dsa_moe
        worker:
          type: hp_unified
          max_batch_tokens: 8192
          attn_gpu_memory_gb: 5.63
sweep:
  replicas: [1, 2]
