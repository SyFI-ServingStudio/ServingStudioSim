# vLLM GLM-5.3-Flash FP8 on B200, DP4 or DP8 attention (TP1 per GPU) with EP4 or EP8
# experts, chunked prefill at 2048 tokens (the Flash DP arch takes only chunked_prefill).
# Worker: the PR #78 Flash study,
# no alignment pack: plain prefill chunking (no vLLM Mamba align-mode chunk ends),
# gpu_time_multiplier 1.0 (pure kernel sum). Its 8192-token chunk is replaced by 2048, the chunk
# of the TP4/EP4 sibling glm53_flash_vllm_fp8_kda_dsa_moe_chunked_prefill (the captured server's,
# also its largest CUDA graph).
# attn_gpu_memory_gb: 57.79 GB, the common per-GPU KV/state budget of every Flash FP8 layout:
# the measured TP4/EP4 vLLM device
# budget at gpu_memory_utilization 0.85 (weights 81.00 + KV 68.84 GB) minus the largest 4-GPU
# per-GPU weights (DP4/EP4, 92.05 GB). The study's TraceLab runs used twice it (115.58) only so
# that 1M-token contexts fit.
# vLLM's DP load balancer places requests (dp_placement), as in the study.
deployment: unified
pools:
  main:
    groups:
      - replicas: ${replicas}
        arch:
          preset: glm53_flash_vllm_fp8_dp_attn_ep_moe
          ep_size: ${ep_size}
          max_model_len: ${max_model_len}
        worker:
          type: chunked_prefill
          max_batch_tokens: 2048
          batch_policy: mix
          dp_placement: vllm-least-loaded
          prefill_chunk_alignment: plain
          attn_gpu_memory_gb: 57.79
sweep:
  replicas: [1, 2]
  ep_size: [4, 8]
  max_model_len: [8192, 131072, 524288]
