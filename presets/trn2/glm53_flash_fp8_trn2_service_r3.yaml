# The glm5-trn2 R3 service (round 3 retained, `ddac04a`; glmflash/service) on one trn2.48xlarge: the R1 service
# (two replicas of the 45-layer engine, dp4 x tp8, EP32 FFN, one region per layer; least-loaded replica routing;
# decode-protected waves) plus round 3's decode changes, as measured on device:
#   - an NKI decode-MoE kernel over the active local experts' FP8 weights for M <= 64 gathered rows. Its Probe rows
#     against `dense_local` are 0.42x at M 8 / 32 and 0.85x at M 64; M > 64 stays dense (`moe_partial` scales);
#   - a DSA pooled-key cache read by decode: `radix+pk` against `radix` is 0.84x / 0.78x / 0.72x at B 8 / 16 / 32
#     (`dsa` scales);
#   - lockstep first token (`wave_first_token_from_decode`) and decode buckets 8 / 16. A start-up cap probe serves 16
#     rows per group only if the 16-row step is <= 80 ms. It measured 92 ms, so the official run served 8 rows, C 64.
# Calibration to the region probe and the official measure (glm5-trn2 campaigns/glm8k1k/round3/{probe,DECISION.md}):
#   - mHC and KDA decode are flat from 8 to 16 rows (`mhc_*@2`, `kda@9`, restored for prefill rows);
#   - `region_gap_ms` 0.05, because the measured TPOT is the device step plus ~4.4 ms;
#   - `prefill_device_factor` 1.88, which fits the in-service prefill step of 1236 ms.
# `r3_official` replays the official C 64 request list (InferenceX client, numpy seed 0). It reproduces the official
# round-3 measure (312.0 tok/s/chip, TPOT 66.29 ms, TTFT 44.5 s) within 0.4% (doc/pr/trn2-glm53-flash/ALIGNMENT.md).
# `c128_cap16` is the 16-row service the cap probe declined.
deployment: unified

workload:
  trace_files: ${traces}
  input_file_format: text-generation-independent
  arrival_mode: saturated
  max_concurrency: ${conc}
  run_to_end: true

io:
  log_dir: "logs/trn2/glm53_flash_fp8_trn2_service_r3/{point}"

pools:
  main:
    placement: least-loaded
    groups:
      - gpu: "AWS Trainium2 LNC2"
        replicas: 2
        arch:
          type: glm53_flash_neuron_fp8
          model_config: model/config/glm53_flash.json
          world: 32
          attn_tp: 8
          region_granularity: layer
          prefill_buckets: [2048]
          decode_buckets: ${decode_buckets}
          context_buckets: [2048, 4096, 6144, 6656, 7168, 7680, 8192, 8704, 9216]
          slots: ${slots}
          cmax: 9216
          max_model_len: 9216
          kind_time_scale: ["moe_partial=0.4226", "moe_partial@33=2.0090", "moe_partial@65=1.1779",
                            "dsa=0.8435", "dsa@9=0.9256", "dsa@17=0.9168", "dsa@512=1.3966",
                            "mhc_post@2=0.52", "mhc_pre@2=0.87", "kda@9=0.79", "mhc_post@129=1.9231", "mhc_pre@129=1.1494", "kda@129=1.2658"]
          region_gap_ms: 0.05
          prefill_device_factor: 1.88
        worker:
          type: chunked_prefill
          attn_gpu_memory_gb: 25.769803776
          max_batch_tokens: ${mbt}
          max_prefill_chunk_tokens: 2048
          max_prefill_chunks_per_partition: 1
          max_requests_per_partition: ${maxreq}
          dp_placement: vllm-least-loaded
          wave_admission: true
          wave_quiet_ms: 100
          wave_cap_ms: 2000
          wave_first_token_from_decode: true

compound:
  point:
    r3_official: {conc: 64,  traces: [presets/trn2/inferencex_8k1k_c64.csv],  decode_buckets: [8, 16], maxreq: 8,  slots: 17, mbt: 2056}
    c128_cap16:  {conc: 128, traces: [presets/trn2/inferencex_8k1k_c128.csv], decode_buckets: [8, 16], maxreq: 16, slots: 17, mbt: 2064}
