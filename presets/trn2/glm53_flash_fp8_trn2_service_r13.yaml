# The glm5-trn2 R13 service (round 13 retained, `990cfa2`): the calibrated round-11 service model of the campaign's
# layout study (glm5-trn2 `campaigns/glm8k1k/layout-study-20261118/`, base: Tick 12's round-11 model) with round 13's
# changes. The model, by round:
# - Round 10 (`fe7d0e4`): round 9's KDA prefill kernel with fp32 gate products and round 8's sparse DSA decode.
#   The prefill composition excess falls from `prefill_device_factor` 1.88 to 1.53.
# - Round 11 (`e4f3578`): KDA decode as an NKI kernel (`kda` / `kda@9`), the wave scheduler with lockstep first token,
#   the measured host floor (`host_time_scale` 0.28) and the per-kind ratios below. A decode
#   `region_device_factor` of 1.12 reproduces round 11 (394.9 @ 19.69 against the official 398.54 @ 19.74, 16-row step
#   62.5 vs 62.7 ms). The 0.12 excess is mostly the wait at the MoE combine: expert-load imbalance, ~170 us per layer.
# - Round 13 (`990cfa2`): deterministic expert placement (9 per EP rank) removes 30 of those 170 us per layer
#   (-0.12 x 30 / 170); fp32 cross-rank partials add ~0.3 ms per decode step (+0.3 / 47); prefill chunk 4096.
#   `region_device_factor` 1.1052.
# `r13_official` replays the official C 64 request list: 419.0 tok/s/chip @ 19.93 tok/s/user, TPOT 50.2 ms, TTFT
# 32.4 s, against the official round-13 measure's 419.45 @ 19.82 (TPOT 50.44 ms, TTFT 31.9 s; same-code samples
# 419.45-420.86). The 16-row step stays above the cap (round 13: 55 ms; round 14: 49 ms), so the service runs C 64.
# `c128_cap16` is the C 128 what-if (560.6 @ 16.19). `r14_dsa_x05` / `r14_dsa_x07` are round 14's hypothesis: the
# DSA decode front in NKI at 0.5x / 0.7x of today's DSA decode time, decode rows only (447.9 @ 22.12 / 435.4 @ 21.19 at
# C 64). `kind_time_scale` entries are cumulative (a call multiplies every entry of its kind with min_rows <= rows), so
# a decode-only what-if scales `dsa` by f and `dsa@512` by 1/f. Round 14 measured the x0.6 case
# (glm53_flash_fp8_trn2_service_r14.yaml). doc/pr/trn2-glm53-flash/ALIGNMENT.md has the alignment record.
deployment: unified

workload:
  trace_files: ${traces}
  input_file_format: text-generation-independent
  arrival_mode: saturated
  max_concurrency: ${conc}
  run_to_end: true

io:
  log_dir: "logs/trn2/glm53_flash_fp8_trn2_service_r13/{point}"
  cost_log_mode: stride
  cost_log_stride_iterations: 16

pools:
  main:
    placement: least-loaded
    groups:
      - gpu: "AWS Trainium2 LNC2"
        replicas: 2
        arch:
          type: glm53_flash_neuron_fp8
          model_config: model/config/glm53_flash.json
          world: 32
          attn_tp: 8
          region_granularity: layer
          prefill_buckets: [4096]
          decode_buckets: ${decode_buckets}
          context_buckets: [2048, 4096, 6144, 6656, 7168, 7680, 8192, 8704, 9216]
          slots: ${slots}
          cmax: 9216
          max_model_len: 9216
          kind_time_scale: ${kts}
          region_gap_ms: 0.05
          host_time_scale: 0.28
          prefill_device_factor: 1.53
          region_device_factor: 1.1052
          spmd_padding: true
        worker:
          type: chunked_prefill
          attn_gpu_memory_gb: 25.769803776
          max_batch_tokens: ${mbt}
          max_prefill_chunk_tokens: 4096
          max_prefill_chunks_per_partition: 1
          max_requests_per_partition: ${maxreq}
          dp_placement: vllm-least-loaded
          wave_admission: true
          wave_quiet_ms: 100
          wave_cap_ms: 2000
          wave_first_token_from_decode: true
          batch_policy: mix

compound:
  point:
    r13_official: {kts: ["moe_partial=0.3945", "moe_partial@33=1.2973", "moe_partial@65=1.9540", "dsa=0.7313", "dsa@9=0.7494", "dsa@17=0.8711", "dsa@512=2.0946", "mhc_post=0.45", "mhc_post@2=0.52", "mhc_post@129=4.2735", "mhc_pre=0.45", "mhc_pre@2=0.87", "mhc_pre@129=2.5543", "kda=0.3300", "kda@9=0.79", "kda@129=3.8358"], conc: 64, traces: [presets/trn2/inferencex_8k1k_c64.csv], decode_buckets: [8], maxreq: 8, slots: 9, mbt: 4104}
    c128_cap16: {kts: ["moe_partial=0.3945", "moe_partial@33=1.2973", "moe_partial@65=1.9540", "dsa=0.7313", "dsa@9=0.7494", "dsa@17=0.8711", "dsa@512=2.0946", "mhc_post=0.45", "mhc_post@2=0.52", "mhc_post@129=4.2735", "mhc_pre=0.45", "mhc_pre@2=0.87", "mhc_pre@129=2.5543", "kda=0.3300", "kda@9=0.79", "kda@129=3.8358"], conc: 128, traces: [presets/trn2/inferencex_8k1k_c128.csv], decode_buckets: [8, 16], maxreq: 16, slots: 17, mbt: 4112}
    r14_dsa_x05: {kts: ["moe_partial=0.3945", "moe_partial@33=1.2973", "moe_partial@65=1.9540", "dsa=0.36565", "dsa@9=0.7494", "dsa@17=0.8711", "dsa@512=4.1892", "mhc_post=0.45", "mhc_post@2=0.52", "mhc_post@129=4.2735", "mhc_pre=0.45", "mhc_pre@2=0.87", "mhc_pre@129=2.5543", "kda=0.3300", "kda@9=0.79", "kda@129=3.8358"], conc: 64, traces: [presets/trn2/inferencex_8k1k_c64.csv], decode_buckets: [8], maxreq: 8, slots: 9, mbt: 4104}
    r14_dsa_x07: {kts: ["moe_partial=0.3945", "moe_partial@33=1.2973", "moe_partial@65=1.9540", "dsa=0.51191", "dsa@9=0.7494", "dsa@17=0.8711", "dsa@512=2.99229", "mhc_post=0.45", "mhc_post@2=0.52", "mhc_post@129=4.2735", "mhc_pre=0.45", "mhc_pre@2=0.87", "mhc_pre@129=2.5543", "kda=0.3300", "kda@9=0.79", "kda@129=3.8358"], conc: 64, traces: [presets/trn2/inferencex_8k1k_c64.csv], decode_buckets: [8], maxreq: 8, slots: 9, mbt: 4104}
