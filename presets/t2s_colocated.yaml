# Text2SQL colocated arm (slime colocate_idle_measurement, Qwen2.5-Coder-7B-Instruct,
# 8x H200, SGLang 0.5.5.post1, decode fa3): the inference phase of each of the 35
# steps, one run per step. Traces: tools/t2s/build_t2s_trace.py -> trace/t2s/colocated
# (manifest.json pins the per-turn export). Alignment: tools/t2s/align_colocated.py.
#
# Measured, not fitted: attn_gpu_memory_gb 89.2041 = 1,555,596 KV tokens/engine x
#   57,344 B (SGLang's startup log); chunked prefill 8192 and the bounded-future
#   ratios are SGLang 0.5.5 defaults. Prefill attention is fa2 (no sgl_fa3 prefill
#   rows). Placement: the measured run routed cache_aware, which the simulator does
#   not model; the trace pins each GRPO group to engine (group mod 8) instead.
deployment: unified
workload:
  trace_files: ${rollout}
  input_file_format: text-generation-independent
  input_file_tags: [session, placement]
  arrival_mode: trace_timed
  request_rate: 1.0
  run_to_end: true
io:
  log_dir: logs/t2s/runs/colocated/{rollout}
pools:
  main:
    placement: trace-directed
    groups:
      - gpu: "NVIDIA H200"
        replicas: 8
        arch:
          type: llama3_dense
          model_config: model/config/qwen2_5_coder_7b_instruct.json
        worker:
          type: chunked_prefill
          max_batch_tokens: 8192
          batch_policy: separate-prefill-priority
          attn_gpu_memory_gb: 89.2041
          kv_admission_policy: bounded-future
          kv_page_size: 1
          kv_max_future_tokens: 4096
          kv_initial_new_token_ratio: 0.7
          kv_minimum_new_token_ratio: 0.098
          kv_new_token_ratio_decay_steps: 600
          kv_retract_decode_steps: 20
          decode_retraction_policy: length
          gpu_time_multiplier: 1.0
backends:
  main/unified.embedding: [triton]
  main/unified.pre_attn.input_norm: [flashinfer]
  main/unified.pre_attn.qkv_proj: [torch, torch_linear]
  main/unified.attn.attn.kv_cache_append: [vllm_cuda]
  main/unified.attn.attn.prefill: [fa2]
  main/unified.attn.attn.decode: [sgl_fa3]
  main/unified.post_attn.o_proj: [torch, torch_linear]
  main/unified.post_attn.post_norm: [flashinfer]
  main/unified.post_attn.up_gate_proj: [torch, torch_linear]
  main/unified.post_attn.activation: [triton]
  main/unified.post_attn.down_proj: [torch, torch_linear]
  main/unified.final_norm: [flashinfer]
  main/unified.lm_head: [torch, torch_linear]
sweep:
  rollout:
    r0: ["trace/t2s/colocated/r0.csv"]
    r1: ["trace/t2s/colocated/r1.csv"]
    r2: ["trace/t2s/colocated/r2.csv"]
