# SSEngine as built (pp-impl lanes/release, `ssengine serve` design config): GLM-5.3-Flash NVFP4 prefill on one B200
# PP4 pipeline, the v3 M6 sessions at N = 300 with the evaluation's full setting (HBM 100.18 GB + DRAM 50 GB + SSD
# 128 GB per GPU), 20 minutes. Every mechanism is its own key, so an ablation is this preset with one key changed;
# b200_pp4_prefill.md beside this file gives each key's source in the engine and the key each ablation changes.
#
# Workload: TraceLab v3 coding-agent sessions arriving at 2 per second (2,457 sessions, 260,801 rounds). The trace
# CSV is not committed (~19 MB); copy it into trace/ by hand. Its manifest (sessions_2ps_v3.manifest.json beside
# this preset) gives the source and the sha256.
deployment: pp

workload:
  trace_files:
    - trace/sessions_2ps_v3.csv
  input_file_format: text-generation-session-execution-v2
  arrival_mode: trace_timed
  request_rate: 1.0
  max_concurrency: 300
  run_to_end: false
  duration_ms: 1200000.0

io:
  log_dir: logs/tuned_engine/glm53_flash_nvfp4_b200_pp4_prefill

pools:
  stage:
    groups:
      - gpu: NVIDIA B200
        replicas: 1
        arch:
          type: glm53_flash_vllm_nvfp4_pp_kda_dsa_moe
          model_config: model/config/glm53_flash_nvfp4.json
          fp8: false
          pp_size: 4
          layer_partition: [12, 11, 11, 11]
          max_model_len: 1048576
          mla_layout_copies: false
          indexer_max_logits_mb: 512
          routing: corpus
          token_corpus_file: hf://datasets/UW-SyFI/servingstudio-workload@c3f5ecaab0bbff757c64864bf2ec24f5e1f76b5c/glm53_flash_fp8/vllm/balanced_c32/capture/20260924/manifest.json
        worker:
          type: pipeline_chunked_prefill
          gpu_time_multiplier: 1.0
          prefill_chunk_alignment: plain
          # KV: 128-token pages, the compact 320-page KDA state (kpool tails inside it), one kept state per context
          # (the measured eval engine a78dc6f). The release's kept_states = 2 is `recurrent_state_checkpoints: 2`:
          # no measured run backs it, and whether `Latest{k: 2}` charges HBM as the engine's k2 does is unverified.
          # context_end: the engine saves the state where its pass ended (the default would resume at the prompt end).
          attn_gpu_memory_gb: 100.18
          kv_block_tokens: 128
          kv_part_padding: [kda=66969600, kpool_tail=0]
          prefix_resume_points: context_end
          recurrent_state_checkpoints: 1
          # Prefill only: a round completes at its first token and decode runs elsewhere.
          external_decode: true
          # Scheduler `good`.
          max_batch_tokens: 32768
          microbatch_split: even
          min_microbatch_tokens: 512
          long_prefill_token_threshold: 0
          pending_order: shortest-prefill-first
          srpt: true
          load_budget_low_tokens: 4096
          load_budget_backlog_lo_tokens: 1000000
          load_budget_backlog_hi_tokens: 3000000
          force_schedule_after_ms: 60000.0
          # Tiers: HBM -> DRAM (exclusive victim) -> SSD (victim), balanced storage, a 10% staged loading area.
          dram_tier_gb: 50.0
          dram_tier_gb_per_s: 50.0
          dram_tier_writes: hbm-evictions-exclusive
          ssd_tier_gb: 128.0
          ssd_tier_gb_per_s: 10.0
          ssd_tier_writes: dram-evictions
          prefix_tier_balanced_load: true
          prefix_tier_loading_area: 0.1
          prefix_tier_warm_start: false

backends_file: b200_pp4_prefill.backends.yaml
