# DeepSeek-V4.1-Flash on one four-GPU B200 NVLink domain under the vLLM V1
# scheduler: TP4 attention and EP4 experts over the same four ranks, chunked
# prefill with a 2048-token budget. Mirrors the capture-2 deployment
# (logs/20260924_0_dsv41_flash_capture/profile_nsys_cg2048.yaml).
deployment: unified

workload:
  # The capture-2 workload: 96 requests (128/128, 128/4096, 4096/128,
  # 3072/3072 x 24), saturated at 48 in flight.
  trace_files:
    - trace/quadrant_c48_96.csv
  input_file_format: text-generation-independent
  arrival_mode: saturated
  max_concurrency: 48
  run_to_end: true

io:
  log_dir: logs/deepseek_v41_flash_b200_vllm_tp4_ep4

pools:
  main:
    groups:
      - gpu: "NVIDIA B200"
        replicas: 1
        arch:
          type: deepseek_v41_vllm
          model_config: model/config/deepseek_v41_flash.json
          fp8: true
          # The capture's --max-model-len. Omitted, it defaults to the
          # checkpoint's 1048576; it is a timing input (the FlashMLA prefill
          # workspace, the indexer's padded logits rows), so this pin keeps the
          # captured 131072 rows.
          max_model_len: 131072
          # Recorded per-token expert routes from the 1017 checkpoint's TP4/EP4
          # token_corpus pass (repo-relative until published to the HF dataset).
          routing: corpus
          token_corpus_file: logs/20261106_0_dsv41_dspark_capture/profile_tp4ep4_corpus/token_corpus/manifest.json
          # The captured vLLM predates decoder SWA bounded replay (the arch
          # default, on in the current fork): pinned off here.
          decoder_swa_bounded_replay: false
        worker:
          type: chunked_prefill
          # vLLM max_num_batched_tokens=2048. The V1 scheduler fills decodes
          # first and spends the remaining budget on prefill chunks in the same
          # iteration (mixed batches).
          max_batch_tokens: 2048
          batch_policy: mix
          # recommended_gpu_time_multiplier from the capture-2 kernel alignment
          # (Analyzer al_6e04cf7b..., sum of measured GPU cycle / sum of
          # measured kernel time). It stretches kernel sums to the measured
          # duty cycle.
          gpu_time_multiplier: 1.0361
          # vLLM KV pool per GPU in capture 2: 603004 blocks x 135168 B (the
          # smallest rank's budget; "GPU KV cache size: 46,767,420 tokens" is
          # that pool divided into 131072-token requests). The arch's layout
          # charges the compressed caches, the sliding window and the
          # compressor ring as vLLM's packed groups do.
          attn_gpu_memory_gb: 81.506844672
