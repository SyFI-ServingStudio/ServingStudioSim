# Smoke test for the canonical TraceLab execution trace.
#
# The trace is generated by TraceLab's `tracegen` from the public syfi
# coding-agent dataset, and the same bytes drive a measured replay. Sessions are
# chained, so each round is released by its predecessor's completion plus the
# recorded tool wait rather than by a timeline.
deployment: unified

workload:
  trace_files:
    - trace/session_execution_v2_smoke.csv
  trace_kind: text_generation
  trace_source_schema: session-execution-v2
  replay_pacing: open_loop
  session_dependency: chained
  run_to_end: true
  request_rate: 1.0

io:
  log_dir: logs/session_execution_v2_smoke

pools:
  main:
    groups:
      - gpu: "NVIDIA H200"
        replicas: 1
        arch:
          type: llama3_dense
          model_config: model/config/llama3_8b.json
        worker:
          type: barebone
