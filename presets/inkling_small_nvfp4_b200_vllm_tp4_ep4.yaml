# Inkling-Small-NVFP4 on one four-GPU B200 NVLink domain under the vLLM fork's V1
# scheduler: TP4 attention, dense FFN and sink experts, EP4 routed experts over the
# same four ranks, chunked prefill with a 2048-token budget, no speculative
# decoding. Mirrors the Phase 0 capture
# (logs/20261007_0_inkling_small_nvfp4_tp4ep4/profile_nsys.yaml, job 4575).
deployment: unified

workload:
  # The capture's workload shapes: 256 requests, inputs 256/1024/2048/4096 x
  # outputs 128/256, saturated at 32 in flight.
  trace_files:
    - trace/balanced_c32.csv
  input_file_format: text-generation-independent
  arrival_mode: saturated
  max_concurrency: 32
  run_to_end: true

io:
  log_dir: logs/inkling_small_nvfp4_b200_vllm_tp4_ep4

pools:
  main:
    groups:
      - gpu: "NVIDIA B200"
        replicas: 1
        arch:
          type: inkling_vllm_nvfp4_rel_attn_moe
          model_config: model/config/inkling_small_nvfp4.json
          fp8: false
          tp_size: 4
          enable_expert_parallel: true
          # The capture's --max-model-len; it sets the global layers' FA4
          # split count.
          max_model_len: 8192
          # Recorded per-token expert routes from the capture's token_corpus
          # pass (job 4473, EPLB off). Local to this workspace: it is not yet in
          # the published workload dataset.
          routing: corpus
          token_corpus_file: logs/20261007_0_inkling_small_nvfp4_tp4ep4/profile_token_corpus/token_corpus/manifest.json
          # The capture's --cudagraph-capture-sizes (max_cudagraph_capture_size
          # 2048, FULL_AND_PIECEWISE with no splitting ops).
          cudagraph_capture_sizes: [1, 2, 4, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120, 128, 136, 144, 152,
                                     160, 168, 176, 184, 192, 200, 208, 216, 224, 232, 240, 248, 256, 272, 288, 304, 320, 336, 352,
                                     368, 384, 400, 416, 432, 448, 464, 480, 496, 512, 528, 544, 560, 576, 592, 608, 624, 640, 656,
                                     672, 688, 704, 720, 736, 752, 768, 784, 800, 816, 832, 848, 864, 880, 896, 912, 928, 944, 960,
                                     976, 992, 1008, 1024, 1040, 1056, 1072, 1088, 1104, 1120, 1136, 1152, 1168, 1184, 1200, 1216,
                                     1232, 1248, 1264, 1280, 1296, 1312, 1328, 1344, 1360, 1376, 1392, 1408, 1424, 1440, 1456, 1472,
                                     1488, 1504, 1520, 1536, 1552, 1568, 1584, 1600, 1616, 1632, 1648, 1664, 1680, 1696, 1712, 1728,
                                     1744, 1760, 1776, 1792, 1808, 1824, 1840, 1856, 1872, 1888, 1904, 1920, 1936, 1952, 1968, 1984,
                                     2000, 2016, 2032, 2048]
        worker:
          type: chunked_prefill
          # vLLM max_num_batched_tokens=2048: decodes first, the remaining
          # budget to prefill chunks in the same iteration.
          max_batch_tokens: 2048
          batch_policy: mix
