# SSEngine's kernel backends on the PP stage pool, over the PP arch's vLLM defaults: FlashInfer persistent KDA
# chunked prefill, Dao channel-last short conv, DeepGEMM mega mHC on every fused post/pre boundary, and the DSA
# top-k per launch the faster of DeepSelect and vLLM (a launch packing several requests runs on vLLM only, which
# takes row starts). Every other role keeps its arch default. The timing-predict config carries the same choices
# under the `unified.` roles (iteration_predict.json).
backends:
  stage/pp.first_kda_dense.kda.chunk_prefill: [flashinfer_cute_persistent]
  stage/pp.kda_dense.kda.chunk_prefill: [flashinfer_cute_persistent]
  stage/pp.kda_moe.kda.chunk_prefill: [flashinfer_cute_persistent]
  stage/pp.first_kda_dense.kda.short_conv_prefill: [dao_channellast]
  stage/pp.kda_dense.kda.short_conv_prefill: [dao_channellast]
  stage/pp.kda_moe.kda.short_conv_prefill: [dao_channellast]
  stage/pp.first_kda_dense.ffn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.kda_dense.attn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.kda_dense.ffn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.kda_moe.attn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.kda_moe.ffn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.dsa_moe.attn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.dsa_moe.ffn_mhc_post_pre: [deepgemm_mega_nonshifted]
  stage/pp.dsa_moe.dsa.indexer.topk_prefill: [deep_select, vllm_cuda]
