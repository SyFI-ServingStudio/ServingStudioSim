# SSEngine's kernel backends on the PP stage pool: every role of the PP arch, as the launcher requires, at its
# vLLM default (`--emit-backends`) except SSEngine's choices: FlashInfer persistent KDA chunked prefill, Dao
# channel-last short conv, DeepGEMM mega mHC on every fused post/pre boundary, and the DSA top-k per launch the
# faster of DeepSelect and vLLM (a launch packing several requests runs on vLLM only, which takes row starts).
# The timing-predict config carries the same choices under the `unified.` roles (iteration_predict.json).
