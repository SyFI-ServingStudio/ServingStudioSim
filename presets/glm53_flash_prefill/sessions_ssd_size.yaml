# GLM-5.3-Flash NVFP4 prefill on one B200 PP4 pipeline as SSEngine runs it (engine choices: README.md): SSD
# 32-256 GB per GPU under the full (HBM 100.18 + DRAM 50 GB) and tiers (HBM 20 + DRAM 20 GB) settings, N = 300,
# 400.
#
# Workload: TraceLab v3 coding-agent sessions arriving at 2 per second (2,457 sessions, 260,801 rounds), a cap of
# N sessions in flight, 20 minutes. The trace CSV is not committed (~19 MB); provision it per the create-worktree
# skill. Its committed manifest (trace/sessions_2ps_v3.manifest.json) gives the source and the sha256.
deployment: pp

workload:
  trace_files: ${trace}
  input_file_format: text-generation-session-execution-v2
  arrival_mode: trace_timed
  request_rate: 1.0
  max_concurrency: ${conc}
  run_to_end: false
  duration_ms: ${duration_ms}

io:
  log_dir: logs/glm53_flash_prefill/sessions_ssd_size/{tiers}/c{conc}

pools:
  stage:
    groups:
      - gpu: NVIDIA B200
        replicas: 1
        arch:
          type: glm53_flash_vllm_nvfp4_pp_kda_dsa_moe
          model_config: model/config/glm53_flash_nvfp4.json
          fp8: false
          pp_size: 4
          layer_partition: [12, 11, 11, 11]
          max_model_len: 1048576
          mla_layout_copies: false
          indexer_max_logits_mb: 512
          routing: corpus
          token_corpus_file: hf://datasets/UW-SyFI/servingstudio-workload@c3f5ecaab0bbff757c64864bf2ec24f5e1f76b5c/glm53_flash_fp8/vllm/balanced_c32/capture/20260924/manifest.json
        worker:
          type: pipeline_chunked_prefill
          max_batch_tokens: ${max_batch_tokens}
          gpu_time_multiplier: 1.0
          prefill_chunk_alignment: plain
          attn_gpu_memory_gb: ${hbm}
          external_decode: true
          dram_tier_gb: ${dram}
          dram_tier_gb_per_s: 50.0
          dram_tier_writes: ${dram_writes}
          ssd_tier_gb: ${ssd}
          ssd_tier_gb_per_s: 10.0
          ssd_tier_writes: ${ssd_writes}
          prefix_tier_warm_start: false
          prefix_tier_max_read_wait_ms: 1000.0
          prefix_tier_balanced_load: ${balanced}
          prefix_tier_loading_area: ${area}
          force_schedule_after_ms: ${force_ms}
          microbatch_split: ${split}
          min_microbatch_tokens: ${min_mb}
          long_prefill_token_threshold: 0
          pending_order: ${order}
          load_budget_low_tokens: ${bl_low}
          load_budget_backlog_lo_tokens: ${bl_lo}
          load_budget_backlog_hi_tokens: ${bl_hi}
          srpt: ${srpt}

sweep:
  trace: [[trace/sessions_2ps_v3.csv]]
  duration_ms: [1200000.0]
  conc: [300, 400]
compound:
  tiers:
    full_ssd32: {hbm: 100.18, dram: 50.0, ssd: 32.0, balanced: true}
    full_ssd64: {hbm: 100.18, dram: 50.0, ssd: 64.0, balanced: true}
    full_ssd128: {hbm: 100.18, dram: 50.0, ssd: 128.0, balanced: true}
    full_ssd256: {hbm: 100.18, dram: 50.0, ssd: 256.0, balanced: true}
    tiers_ssd32: {hbm: 20.0, dram: 20.0, ssd: 32.0, balanced: true}
    tiers_ssd64: {hbm: 20.0, dram: 20.0, ssd: 64.0, balanced: true}
    tiers_ssd128: {hbm: 20.0, dram: 20.0, ssd: 128.0, balanced: true}
    tiers_ssd256: {hbm: 20.0, dram: 20.0, ssd: 256.0, balanced: true}
  mode:
    st10: {dram_writes: hbm-evictions-exclusive, ssd_writes: dram-evictions, area: 0.1}
  sched:
    good: {max_batch_tokens: 32768, split: even, min_mb: 512, order: shortest-prefill-first, bl_low: 4096, bl_lo: 1000000, bl_hi: 3000000, srpt: true, force_ms: 60000.0}

backends_file: backends_ssengine.yaml
